- aid: apperio:apperio-filter-api
  name: Apperio Filter API
  description: "The filter endpoints provide resource discovery in Apperio. This has\ntwo basic mechanisms.\
    \ Firstly there are the resource discovery endpoints.\nThese are:\n  * `/api/v1/filter/engagements/`\n\
    \  * `/api/v1/filter/invoices/`\n  * `/api/v1/filter/matter-tags/`\n\nThese endpoints return lists\
    \ of resource references with decorating metadata\nthat can be filtered, ordered and paginated.\n\n\
    Secondly resources may be tagged. The tag management endpoints allow you to\ncreate different groupings\
    \ of matters\n\nFor those familiar with writing SQL queries, the resource discovery endpoints\ncan\
    \ be thought of in a similar way. The `SELECT` section or projection clause\ndetermines which fields\
    \ are returned. The `WHERE` clause or filter section determines\nwhich records are returned and `ORDER\
    \ BY` section determines the order that they are\nreturned in. Ordering and pagination is covered\
    \ in the section above. Below, we will\ntake each of the other sections in turn to show how these\
    \ are handled on these endpoints. \n\n**Data Projection**\n\nThe filter API is designed to provide\
    \ broad information about resources for easy resource\ndiscovery. The client can choose which denormalised\
    \ fields can appear in the projection\nclause using the `fields` query parameter. Only the fields\
    \ listed in this query parameter,\ntogether with any mandatory fields, will be included in the response.\n\
    The field names are URL encoded comma (%2C) separated.\n\nFor example if I wish to bring back the\
    \ fields `one`, `two` and `three` I would query the\nendpoint with:\n\n```\n...?fields=one%2Ctwo%2Cthree\n\
    ```\n\nAnd the response will bring back only those fields and any mandatory fields (such as the\n\
    identifier for the resource). For example the response may be:\n\n```json\n{\n  \"results\": [\n \
    \   {\n        \"one\": 5000.0,\n        \"two\": 5,\n        \"three\": false\n    },\n    {\n  \
    \      \"one\": 86645.23,\n        \"two\": 59541,\n        \"three\": false\n    }\n  ],\n  \"pagination\"\
    : {\n      \"next\": null,\n      \"previous\": null,\n      \"nextPage\": null,\n      \"previousPage\"\
    : null\n  }\n}\n```\n\nThe full list of available fields can be seen in the response body for that\
    \ endpoint.\n\n**Resource Permissions**\n\nThe set of resources that can be discovered in the API\
    \ is limited to those that\nthe user generating the token has access to. This can then be filtered\
    \ further\nusing explicit filters; resources that the user is not authorized to see will not\nbe returned.\n\
    \n**Filtering the data**\n\nOn the resource discovery endpoints the returning data can be filtered\n\
    by each of the fields on the resource. Each field has been associated with\nthe type of filter that\
    \ will make it easier to discover resources. The filter\ntypes are explained below.  \n\n*Range filters*\n\
    \nRange filters allow a slice of the data to be selected. They can be used to\nselect all data less\
    \ than equal to a value; all data above or equal to a value\nor can be combined to return a slice\
    \ of the data. For example if I have the\nfield `foo` and wish to return all data between 10000 and\
    \ 12000 GBP I would add\nthe filters:\n\n```\n?foo__gte=10000&foo__lte=12000\n```\n\nWhen the field\
    \ is a monetary field it is assumed that these values will be in\nyour organisation's base currency\
    \ and any transactions in another currency will\nbe subject to a exchange conversion on the rate held\
    \ for the date of that\ntransaction.\n\n**Text filters**\n\nText filters will return all entries that\
    \ start with the selected value. For\nexample if I wanted to bring back all matters that started with\
    \ the name 'Pricing'\nI would filter on\n\n```\n?law_firm_name__icontains=Pricing\n```\n\nThese query\
    \ would bring back matters called both 'Pricing development contract'\nand 'Pricing housing development'\n\
    \n**Choice filters**\n\nChoice filters allow both exact matching and a selection of values to be matched.\n\
    For example, to search for the single value apple I would include:\n\n```\n?bar=apple\n```\n\nTo bring\
    \ back both apples, pairs and mangos:\n\n```\n?bar__in=apple%2Cpair%2Cmango\n```\n\nWhere the field\
    \ can be null, the `__isnull` filter is provided\n\n```\n?foo__isnull=true\n```\n\nIf you want to\
    \ incorporate null as one of the choices then `__is_null`\nand `__in` on the same field returns the\
    \ _union_ of those resources that\nmatch one of those values and those resources where this field\
    \ isn't set:\n\n```\n?foo__isnull=true&foo__in=cucumber%2Ctomato\n```\n\n**Boolean filters**\n\nBoolean\
    \ filters filter out data where a field is true or false. For example, if\nI want to bring back matters\
    \ that I haven't yet shared with the business.\n\n```\n?is_shared=false\n```"
