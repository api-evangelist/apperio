aid: apperio
name: Apperio
description: >-
  Apperio is a legal spend management and matter management platform for in-house
  legal teams and the law firms they work with. It connects directly to law-firm
  time-and-billing systems to give continuous, real-time visibility into billed and
  unbilled ("work in progress") legal spend, benchmarking to negotiate rates, and
  AI-assisted e-billing review against Outside Counsel Guidelines. The Apperio REST
  API exposes the same secure data that powers the platform's analytics — legal-spend
  analytics, matter (engagement) and invoice discovery, matter tagging, and e-billing
  invoice approval workflows — across its two-sided business/law-firm model. Apperio
  is a Seedcamp portfolio company and is now part of Persuit.
