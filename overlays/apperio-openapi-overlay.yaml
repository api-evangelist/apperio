overlay: 1.0.0
info:
  title: API Evangelist enhancements for Apperio API
  version: 1.0.0
extends: openapi/apperio-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: apperio
      x-apievangelist-industry: Legal spend management
      x-apievangelist-auth: apiKey (Authorization header, 'Token <value>')
      x-apievangelist-error-format: field-keyed-messages
  - target: $.components
    update:
      securitySchemes:
        ApiToken:
          type: apiKey
          in: header
          name: Authorization
          description: >-
            Apperio API token supplied as 'Authorization: Token <TOKEN VALUE>'.
            Documented at developer.apperio.com but absent from the raw spec's
            components.securitySchemes.
  - target: $
    update:
      security:
        - ApiToken: []
