        - name: aged_wip
          in: query
          schema:
            type: string
            description: >
              Filter matters that have unbilled entries that are X days old.
              Where X can be one of the following:

              * `0__30`: WIP is at most 30 days old

              * `31__60`: WIP is more than 30 and at most 60 days old

              * `61__90`: WIP is more than 60 and at most 90 days old

              * `91__180`: WIP is more than 90 and at most 180 days old

              * `181__365`: WIP is more than 180 and at most 365 days old

              * `366__inf`: WIP is more than 365 days old
        - name: aged_wip__in
          in: query
          schema:
            type: string
            description: >
              A comma-separated list of age buckets. The commas must be URL
              encoded (%2C)
            example: 0__30%2C31__60%2C61__90
        - name: budget_level
          in: query
          schema:
            type: string
            enum:
              - 'on'
              - near
              - over
              - none
            description: >
              Filter matters at a certain budget level. The values have the
              following meaning:

              * `on` - Billable amount is less than 75% of the budget

              * `near` - Billable amount is between 75% and 100% of the budget

              * `over` - Billable amount is more than 100% of the budget

              * `none` - The matter has no budget
        - name: budget_level__in
          in: query
          schema:
            type: string
            description: >
              A comma-separated list of budget levels. The commas must be URL
              encoded (%2C)
            example: on%2Cnear
        - name: budget_level_fees
          in: query
          schema:
            type: string
            enum:
              - 'on'
              - near
              - over
              - none
            description: >
              Filter matters at a certain fees budget level. The values have the
              following meaning:

              * `on` - Billable fees amount is less than 75% of the budget

              * `near` - Billable fees amount is between 75% and 100% of the
              budget

              * `over` - Billable fees amount is more than 100% of the budget

              * `none` - The matter has no fees budget
        - name: budget_level_fees__in
          in: query
          schema:
            type: string
            description: >
              A comma-separated list of fees budget levels. The commas must be
              URL encoded (%2C)
            example: on%2Cnear
        - name: budget_level_disbursements
