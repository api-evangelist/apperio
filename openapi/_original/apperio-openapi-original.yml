      description: |
        Capabilities: BUSINESS
      tags:
        - E-billing
      parameters:
        - name: invoice-id
          in: path
          schema:
            type: int
            description: Invoice ID
            example: 12345
      responses:
        '200':
          description: |
            Invoice approval workflow
          content:
            application/json:
              schema:
                type: object
                description: |
                  Invoice approval workflow details.
                properties:
                  invoice_approval_states:
                    type: array
                    description: >
                      The states that the invoice can be in during the approval
                      workflow.
                    items: &ref_14
                      type: object
                      description: |
                        An invoice approval state
                      properties:
                        id:
                          type: int
                          description: >
                            The Apperio identifier of the invoice approval
                            state.
                          example: 12345
                        approval_state_id:
                          type: int
                          description: |
                            The Apperio identifier of the approval state.
                          example: 12345
                        approver: *ref_13
                        assigned_approver: *ref_13
                        step:
                          type: int
                          description: |
                            The step in the approval process.
                          example: 3
                        reviewed_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: >
                            The date and time that this step of the approval
                            process was reviewed

                            (approved, rejected, or queried).


                            `null` if the step has not been reviewed yet.
                          example: '2021-01-01T00:00:00Z'
                        was_approved:
                          type: boolean
                          nullable: true
                          description: >
                            Whether this step of the approval process was
                            approved.

                            `true` if approved, `false` if rejected or queried,
                            `null` if not yet reviewed.
                          example: true
                        notes:
                          type: string
                          nullable: true
                          description: >
                            Notes about this step of the approval process.


                            Required when rejecting, querying, or adjusting the
                            invoice. Optional when approving.
                          example: Looks good to me
                        invoice_status:
                          type: string
                          description: >
                            The status of the invoice at the time in which the
                            state is created.

                            Only populated in some cases.
                          example: in_review
                  tracker_states:
                    type: array
                    description: >
                      The states that the invoice tracker can be in during the
                      approval workflow.
                    items:
                      type: object
                      description: >
                        The invoice state as displayed in the invoice tracker in
                        the Apperio platform.
                      properties:
                        short_name:
                          type: string
                          description: |
                            The short name of the invoice state.
                          example: GC
                        state:
                          type: string
                          description: >
                            The state of this step in the invoice approval
                            workflow.

                            This is one of:
                              * `approved` - The invoice is already past this step.
                              * `review` - The invoice is currently at this step.
                              * `pending` - The invoice is yet to reach this step.
                          enum:
                            - approved
                            - review
                            - pending
                          example: approved
                        stage:
                          type: int
                          description: >
                            The stage of this step in the invoice approval
                            workflow.

                            This is a number that represents the order of the
                            steps in the workflow.
                          example: 3
                          deprecated: true
                  current_step:
                    type: int
                    description: >
                      The current step in the approval workflow.


                      References the `step` property in the
                      `invoice_approval_states` array.
                    example: 3
                  permissions:
                    type: object
                    description: |
                      The permissions that the user has for the invoice.
                    properties:
                      can_approve:
                        type: boolean
                        description: >
                          Whether the user can approve, reject or query the
                          invoice.
                        example: true
                  rejection_next_step:
                    type: int
                    description: >
                      The next step in the approval workflow if the invoice is
                      rejected.


                      This can be one of two values:
                        * 0 - the invoice will be moved back to the beginning of the approval workflow when rejected
                        * 1 - the invoice will be moved to the previous step in the approval workflow when rejected
                    enum:
                      - 0
                      - 1
                    example: 0
                  invoice_total:
                    type: string
                    format: decimal
                    description: |
                      The total amount that is payable on the invoice.
                    example: '1320.00'
                  payable:
                    type: string
                    format: decimal
                    description: |
                      The total amount that is payable on the invoice.
                    example: '1320.00'
                  withheld_fees:
                    type: string
                    format: decimal
                    description: >
                      The total amount of fees that have been withheld from the
                      invoice.


                      *NOTE: This field is specific to Qatar's withholding tax
                      laws.*
                    example: '100.00'
                  withheld_user_id:
                    type: int
                    description: >
                      The user ID that entered the withheld fees.


                      *NOTE: This field is specific to Qatar's withholding tax
                      laws.*
                    example: 12345
                  withheld_date:
                    type: string
                    format: date
                    description: >
                      The date the withheld fees were entered.


                      *NOTE: This field is specific to Qatar's withholding tax
                      laws.*
                    example: '2021-01-01'
