            Unauthorized access - ensure your account has permission to manage
            invoice attributes
        '404':
          description: |
            Attribute not found
    put:
      summary: Update a business invoice attribute
      description: >
        Capabilities: BUSINESS


        Updates an existing invoice attribute.


        The `name` and `attr_type` fields are immutable and cannot be changed
        after creation.

        For `dropdown` attributes, the `options` list is replaced in full on
        each update —

        include all options you wish to retain.
      tags:
        - E-billing
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            description: The machine-readable name of the attribute
            example: cost_center
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 50
                  description: Human-readable label for the attribute
                  example: Cost Center
                default_value:
                  type: string
                  description: >-
                    Default value. For `email` types must be a valid email
                    address.
                  example: CC-0000
                placeholder:
                  type: string
                  maxLength: 30
                  description: Placeholder text shown in the input field
                  example: e.g. CC-1234
                show_in_form:
                  type: boolean
                  description: >-
                    Whether to show this attribute in the invoice submission
                    form
                  example: true
                is_required:
                  type: boolean
                  description: >-
                    Whether this attribute is required on submission. Only valid
                    when `show_in_form` is `true`.
                  example: true
                options:
                  type: array
                  description: >
                    Full replacement list of options. Only valid for `dropdown`
                    attributes.

                    Any options omitted from this list will be deleted (only if
                    their `can_delete` is `true`).
                  items:
                    type: object
                    required:
                      - value
                    properties:
                      id:
                        type: integer
                        description: >-
                          ID of an existing option to update. Omit for new
                          options.
                        example: 101
                      value:
                        type: string
                        maxLength: 255
                        description: >-
                          Display value of the option. Case-insensitively unique
                          per attribute.
                        example: CC-1234
                      law_firm_ids:
                        type: array
                        description: >-
                          IDs of law firms for which this option is available.
                          Empty list means all firms.
                        items:
                          type: integer
                        example:
                          - 12
                          - 34
                      is_default:
                        type: boolean
                        description: >-
                          Whether this is the default option. At most one option
                          per attribute can be the default.
                        example: false
      responses:
        '200':
          description: |
            Attribute updated
          content:
            application/json:
              schema: *ref_15
        '400':
          description: |
            Validation error
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
        '403':
          description: >
            Unauthorized access - ensure your account has permission to manage
            invoice attributes
        '404':
          description: |
            Attribute not found
    delete:
      summary: Delete a business invoice attribute
      description: >
        Capabilities: BUSINESS


        Deletes an invoice attribute.


        An attribute can only be deleted if no invoices currently have a value
        set for it

        (i.e. `can_delete` is `true` on the attribute). Attempting to delete an
        attribute

        that is in use returns `403`.
      tags:
        - E-billing
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            description: The machine-readable name of the attribute
            example: cost_center
      responses:
        '204':
          description: |
            Attribute deleted
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
        '403':
          description: >
            Unauthorized access - either your account does not have permission
            to manage

            invoice attributes, or the attribute cannot be deleted because it is
            referenced

            by one or more invoices (`can_delete` is `false`)
        '404':
          description: |
            Attribute not found
  /api/v1/users/tokens/:
    get:
      summary: List API tokens
      description: >
        Capabilities: BUSINESS, LAW_FIRM


        Returns all API tokens belonging to the authenticated user, ordered by
        creation date

        with the most recently created token first.


        Each token is identified by its `beginning` field — the first 6
        characters of the

        token value. The full token value is only available at the time of
        creation and

        cannot be retrieved afterwards.
      tags:
        - Users
      responses:
        '200':
          description: |
            List of API tokens
          content:
            application/json:
              schema:
                type: array
                items: &ref_16
                  type: object
                  description: An API token belonging to the authenticated user
                  required:
                    - id
                    - beginning
                    - created
                    - is_active
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the token
                      example: 42
                    beginning:
                      type: string
                      description: The first 6 characters of the token, used to identify it
                      example: a1b2c3
                    created:
                      type: string
                      format: date-time
                      description: The date and time the token was created
                      example: '2024-03-15T10:30:00Z'
                    is_active:
                      type: boolean
                      description: Whether the token is currently active
                      example: true
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
    post:
      summary: Create an API token
      description: >
        Capabilities: BUSINESS, LAW_FIRM


        Creates a new API token for the authenticated user. The full token value
        is returned

        in the `raw_token` field **only in this response** — it cannot be
        retrieved again.

        Store it securely immediately after creation.


        A maximum of 2 tokens can be active per user at any time.
      tags:
        - Users
      responses:
        '201':
          description: |
            Token successfully created
          content:
            application/json:
              schema:
                allOf:
                  - *ref_16
                  - type: object
                    required:
                      - raw_token
                    properties:
                      raw_token:
                        type: string
                        description: >
                          The full token value. This is only returned once at
                          creation time

                          and cannot be retrieved again.
                        example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
        '400':
          description: |
            Invalid request - the user already has 2 tokens
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
  /api/v1/users/tokens/{token-id}/:
    delete:
      summary: Delete an API token
      description: >
        Capabilities: BUSINESS, LAW_FIRM


        Permanently deletes the specified API token. Any integrations using this
        token

        will immediately lose access.
      tags:
        - Users
      parameters:
        - name: token-id
          in: path
          required: true
          schema:
            type: integer
            description: Token ID
            example: 42
      responses:
        '204':
          description: |
            Token successfully deleted
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
        '404':
          description: |
            Token not found
  /api/v1/users/tokens/{token-id}/status/:
    put:
      summary: Update token status
      description: >
        Capabilities: BUSINESS, LAW_FIRM


        Activates or deactivates the specified API token. A deactivated token
        cannot be used

        to authenticate requests but is not deleted and can be reactivated at
        any time.


        If you suspect a token has been compromised, deactivate it immediately
        and generate

        a new one.
      tags:
        - Users
      parameters:
        - name: token-id
          in: path
          required: true
          schema:
            type: integer
            description: Token ID
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
                  description: Whether the token should be active
                  example: false
      responses:
        '200':
          description: |
            Updated token status
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_active:
                    type: boolean
                    description: The updated active status of the token
                    example: false
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
        '404':
          description: |
            Token not found
