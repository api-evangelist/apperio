            type: string
            example: dj0yJnA9MiZnPWJiNTdmMDg2NzI2YzQxYWRhZmI4NmZjMjRlODI5ZTIz
            description: >
              Go to a specific page of content. This cursor is returned in the

              `nextPage` and `previousPage` properties of the `pagination`
              object.
        - name: page-size
