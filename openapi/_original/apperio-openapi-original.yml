  /api/v1/ebilling/invoices/business-attributes/:
    get:
      summary: List business invoice attributes
      description: >
        Capabilities: BUSINESS


        Returns all custom invoice attributes configured for the authenticated
        user's business,

        ordered by `order`, then `label`, then `name`.


        Attributes define the custom fields that can be set on invoices
        submitted through Apperio.

        Each attribute's `name` is used as the key in invoice attribute data and
        in

        `attribute_{name}` filter parameters on the invoice filter endpoint.
      tags:
        - E-billing
      parameters:
        - name: show_in_form
          in: query
          schema:
            type: boolean
            description: >-
              Filter attributes by whether they are shown in the invoice
              submission form
      responses:
        '200':
          description: |
            List of attributes
          content:
            application/json:
              schema:
                type: array
                items: &ref_15
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Apperio identifier for the attribute
                      example: 42
                    label:
                      type: string
                      maxLength: 50
                      description: Human-readable label displayed in forms and the UI
                      example: Cost Center
                    name:
                      type: string
                      maxLength: 50
                      description: >
                        Machine-readable field name used as the key in invoice
                        attribute data and in

                        `attribute_{name}` filter parameters. Auto-generated
                        from `label` (lowercased,

                        spaces replaced with underscores) if not provided on
                        creation. Immutable after

                        creation. Must start with a lowercase letter and contain
                        only lowercase letters,

                        numbers, and underscores.
                      example: cost_center
                    attr_type:
                      type: string
                      enum:
                        - text
                        - long_text
                        - email
                        - dropdown
                      description: >
                        The type of the attribute. Immutable after creation.

                        - `text`: short free-text value

                        - `long_text`: multi-line free-text value

                        - `email`: validated email address

                        - `dropdown`: value selected from a predefined list of
                        options
                      example: text
                    default_value:
                      type: string
                      description: >
                        Default value for the attribute. For `dropdown`
                        attributes this is the value

                        of the default option (see `options`). For `email`
                        attributes the value is

                        validated as a valid email address.
                      example: CC-0000
                    placeholder:
                      type: string
                      maxLength: 30
                      description: Placeholder text shown in the input field
                      example: e.g. CC-1234
                    show_in_form:
                      type: boolean
                      description: >-
                        Whether this attribute is shown in the invoice
                        submission form
                      example: true
                    is_required:
                      type: boolean
                      description: >
                        Whether this attribute is required when submitting an
                        invoice. An attribute

                        can only be required if `show_in_form` is `true`.
                      example: true
                    options:
                      type: array
                      nullable: true
                      description: >
                        List of selectable options. Only present for `dropdown`
                        attributes; `null` for

                        all other types.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Apperio identifier for the option
                            example: 101
                          value:
                            type: string
                            maxLength: 255
                            description: >-
                              Display value of the option. Case-insensitively
                              unique per attribute.
                            example: CC-1234
                          law_firm_ids:
                            type: array
                            description: >
                              IDs of law firms for which this option is
                              available. An empty list means

                              the option is available to all firms.
                            items:
                              type: integer
                            example:
                              - 12
                              - 34
                          is_default:
                            type: boolean
                            description: >-
                              Whether this is the default selected option. At
                              most one option per attribute can be the default.
                            example: false
                          order:
                            type: integer
                            description: >-
                              Display order of the option (read-only,
                              auto-assigned)
                            example: 1
                          can_delete:
                            type: boolean
                            description: >-
                              Whether this option can be deleted. `false` if any
                              invoice currently uses this option value.
                            example: true
                    can_delete:
                      type: boolean
                      description: >-
                        Whether this attribute can be deleted. `false` if any
                        invoice currently has a value set for this attribute.
                      example: true
        '401':
          description: |
            Unauthenticated access - ensure to create a valid API token
        '403':
          description: |
            Unauthorized access - endpoint is only available to business users
