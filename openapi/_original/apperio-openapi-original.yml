  /api/v1/filter/invoices/:
    get:
      summary: Discover invoice resources
      description: >
        Capabilities: BUSINESS, LAW_FIRM, PAGINATION



        Invoice discovery endpoint. The returned projection can be controlled by
        setting the

        `fields` parameter to just return the fields you require. Results can be
        ordered and

        paginated.


        ## Filtering by attributes


        Invoices can be filtered by their custom attribute values using dynamic
        query parameters

        in the form `attribute_{name}`, where `{name}` is the attribute name as
        configured for

        the business. For example, to filter invoices where the `cost_center`
        attribute equals

        `CC-1234`, pass `attribute_cost_center=CC-1234`. Attribute filter values
        are matched

        as exact strings. Available attribute names depend on the business
        configuration.
      tags:
        - Filter
      parameters:
        - name: fields
          in: query
          required: true
          schema:
            type: string
            example: invoice_id%2Cbilled%2Cbilling_entity_id
            description: >
              The filter API is designed to provide broad information about
              resources for easy resource

              discovery. The client can choose which denormalised fields can
              appear in the projection clause.

              Only the selected fields will be included in the response. Fields
              are comma

              separated. The commas will need to be URL encoded (%2C)


              The full list of available fields depends on the type of the
              user's organisation (business or firm).

              Most of the fields are available to all users, but some are
              restricted.


              | Field name | Description | Business | Firm |

              |------------|-------------|:--------:|:----:|

              | `invoice_id` | Apperio ID of an invoice | ✅ | ✅ |

              | `service_provider_type` | The type of firm (`legal` or
              `accountancy`).<br> Only available if the business is connected to
              firms of multiple types | ✅ | ❌ |

              | `number` | The invoice number | ✅ | ✅ |

              | `date` | The date the invoice was issued at | ✅ | ✅ |

              | `start_date` | The beginning of the invoice period | ✅ | ✅ |

              | `end_date` | The end of the invoice period | ✅ | ✅ |

              | `business_id` | Apperio ID of the "business" entity | ❌ | ✅ |

              | `billing_entity_id` | The ID of the billing entity | ✅ | ✅ |

              | `billing_entity` | The billing entity. An object with the
              following fields: `id`, `business_id`, `name` | ✅ | ✅ |

              | `law_firm` | The firm. An object with the following fields:
              `id`, `name` | ✅ | ❌ |

              | `law_firm_id` | Apperio ID of a firm | ✅ | ✅ |

              | `law_firm_reference` | The firm reference of the invoice
              (usually equal to the invoice number) | ✅ | ✅ |

              | `law_firm_name` | The name of the firm | ✅ | ❌ |

              | `engagements` | List of matter details for a given invoice. List
              of objects with the following fields: `engagement_id`, `number`,
              `currency`, `billed`, `fees_billed, `disbursements_billed`, `wip`,
              `fees_wip`, `disbursements_wip`, `flagged`, `fees_flagged`,
              `disbursements_flagged`, and either `business_engagement_name` and
              `project_id` or `law_firm_engagement_name`, depending on the type
              of the user | ✅ | ✅ |

              | `credits` | List of credit note details for a given invoice.
              List of objects with the following fields: `id`, `law_firm_id`,
              `law_firm_reference`, `invoice_id`, `is_cancelled`, `date`,
              `refunded_fee`, `refunded_disbursement`, `refunded_tax`,
              `has_been_ebilled`, `document' | ✅ | ✅ |

              | `currency` | The invoice currency | ✅ | ✅ |

              | `billed` | The total amount billed on the invoice| ✅ | ✅ |

              | `total_amount` | The total amount on the invoice (regardless of
              its billed status) | ✅ | ✅ |

              | `total_amount_adjusted` | The total amount on the invoice
              (regardless of its billed status), adjusted to exclude the
              withheld fees | ✅ | ❌ |

              | `billed_business` | The total amount billed on the invoice,
              converted into the business default currency | ✅ | ❌ |

              | `billed_law_firm` | The total amount billed on the invoice,
              converted into the firm default currency | ❌ | ✅ |

              | `fees_billed` | The amount of fees billed on the invoice | ✅ | ✅
              |

              | `fees_billed_business` | The amount of fees billed on the
              invoice, converted into the business default currency | ✅ | ❌ |

              | `fees_billed_law_firm` | The amount of fees billed on the
              invoice, converted into the firm default currency | ❌ | ✅ |

              | `disbursements_billed` | The amount of disbursements billed on
              the invoice | ✅ | ✅ |

              | `disbursements_billed_business` | The amount of disbursements
              billed on the invoice, converted into the business default
              currency | ✅ | ❌ |

              | `disbursements_billed_law_firm` | The amount of disbursements
              billed on the invoice, converted into the firm default currency |
              ❌ | ✅ |

              | `wip` | The total amount expected to be billed on the invoice| ✅
              | ✅ |

              | `wip_business` | The total amount expected to be billed on the
              invoice, converted into the business default currency | ✅ | ❌ |

              | `wip_law_firm` | The total amount expected to be billed on the
              invoice, converted into the firm default currency | ❌ | ✅ |

              | `fees_wip` | The amount of fees expected to be billed on the
              invoice | ✅ | ✅ |

              | `fees_wip_business` | The amount of fees expected to be billed
              on the invoice, converted into the business default currency | ✅ |
              ❌ |

              | `fees_wip_law_firm` | The amount of fees expected to be billed
              on the invoice, converted into the firm default currency | ❌ | ✅ |

              | `disbursements_wip` | The amount of disbursements expected to be
              billed on the invoice | ✅ | ✅ |

              | `disbursements_wip_business` | The amount of disbursements
              expected to be billed on the invoice, converted into the business
              default currency | ✅ | ❌ |

              | `disbursements_wip_law_firm` | The amount of disbursements
              expected to be billed on the invoice, converted into the firm
              default currency | ❌ | ✅ |

              | `has_flagged_items` | Are there any flagged line items on the
              invoice? | ✅ | ✅ |

              | `flagged` | The total amount flagged on the invoice| ✅ | ✅ |

              | `fees_flagged` | The amount of fees flagged on the invoice | ✅ |
              ✅ |

              | `disbursements_flagged` | The amount of disbursements flagged on
