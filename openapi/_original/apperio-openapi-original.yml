  /api/v1/filter/matter-tags/:
    get:
      summary: Discover matter tags
      description: >
        Capabilities: BUSINESS, PAGINATION


        Discover Matter Tags from the aggregations on the matters with the tag.

        Currency fields such as billed and wip are the total spend of all the
        tagged

        matters in the organisation currency. Dates are the earliest or latest
        date

        of all the tagged matters.
      tags:
        - Filter
      parameters:
        - name: fields
          in: query
          required: true
          schema:
            type: string
            example: engagement_id%2Cbilled%2Cearliest_work_date
