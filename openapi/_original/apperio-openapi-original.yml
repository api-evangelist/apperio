  /api/v1/matters/{matter-id}/header:
    get:
      summary: Matter header
      description: |
        Returns data displayed in the header of the matter page.
      parameters:
        - name: matter-id
          in: path
          required: true
          schema:
            type: integer
          description: >
            Inclusive date to gather data from


            IMPORTANT: This parameter depends on the type of user.

            For business users, it is the `project_id`.

            For law firm users - `engagement_id`.

            You can retrieve both from the `/api/v1/filter/engagements`
            endpoint.
          example: 123
      tags:
        - Matter information
      responses:
        '200':
          description: |
            Matter header data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: The ID of the engagement
                    example: 123
                  budget_id:
                    type: integer
                    description: The ID of a budget associated with this engagement
                    example: 456
                  currency: *ref_4
                  client_matter_reference:
                    type: string
                    description: >-
                      A client's matter reference, if different than the law
                      firm's one
                    example: M123-A4789/1
                  fee_structure: *ref_9
                  data_visible_up_to:
                    type: date
                    description: >-
                      The last date the data is visible for. Equals to today's
                      date minus the sharing window.
                  is_nonbillable:
                    type: boolean
                    description: Whether the matter is non-billable
                  law_firm:
                    type: object
                    description: Basic firm details
                    properties:
                      id:
                        type: integer
                        description: The ID of the firm
                        example: 123
                      name:
                        type: string
                        description: The name of the firm
                        example: Example Law Firm
                      service_provider_type:
                        type: string
                        description: The type of the service this firm provides
                        enum:
                          - legal
                          - accountancy
                  law_firm_created_at:
                    type: date
                    description: The date this matter was created in the law firm's PMS
                  law_firm_name:
                    type: string
                    description: The matter name, as provided by the law firm
                  billing_entity:
                    type: object
                    properties:
                      id:
                        type: integer
                      business_id:
                        type: integer
                      name:
                        type: string
                  number:
                    type: string
                    description: Matter number, as provided by the law firm
                  open_dates:
                    type: object
                    description: The date range of when the matter was "open"
                    properties:
                      start_date:
                        type: date
                        example: '2020-05-01'
                      end_date:
                        type: date
                  practice_group:
                    type: object
                    description: The matter's practice group
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  status:
                    type: string
                    description: The matter status
                    enum:
                      - current
                      - closed
                  is_business_name_different:
                    type: boolean
                  client_contact_first_name:
                    type: string
                  client_contact_last_name:
                    type: string
                  client_contact_email:
                    type: string
                  standard_fee_structure:
                    type: object
                    description: >-
                      The "standard" fee structure that the one prvovided by the
                      law firm is mapped to
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      active_fee_structure:
                        type: string
                        enum:
                          - capped
                          - fixed
                          - hourly
                      icon:
                        type: string
                      overrides:
                        type: array
                  client_name:
                    type: string
                    description: The name of the client
                  law_firm_closed_at:
                    type: date
                    description: The matter close date, as provided by the law firm
                  project:
                    type: object
                    description: The matter metadata provided by the business
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      business_matter_type:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      folder:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                            description: The folder name
                          full_folder_name:
                            type: string
                            description: >-
                              The full path to the folder, including all is
                              ancestors
                      pass_through:
                        type: boolean
                        description: Whether it is a pass-through matter
                      team:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      matter_owners:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            matter:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            user:
                              type: object
                              properties:
                                id:
                                  type: integer
                                first_name:
                                  type: string
                                last_name:
                                  type: string
                                email:
                                  type: string
                            assignment_start:
                              type: date
                            assignment_end:
                              type: date
                      confidential:
                        type: boolean
                  is_business_manual:
                    type: boolean
                    description: Whether the matter was created manually by the business
                  is_redacted:
                    type: boolean
                    description: >-
                      Whether the data is redacted (because the matter is
                      confidential and the user does not have access to
                      confidential matters)
  /api/v1/ebilling/invoices/{invoice-id}/:
    get:
      summary: Get the invoice details
      description: |
        Capabilities: BUSINESS, LAW_FIRM
      tags:
        - E-billing
      parameters:
        - name: invoice-id
          in: path
          schema:
            type: int
            description: Invoice ID
            example: 12345
      responses:
        '200':
          description: |
            Invoice details
          content:
            application/json:
              schema:
                type: object
                description: >
                  An e-billing invoice that has been submitted to Apperio for
                  processing.
                required:
                  - name
                properties:
                  id:
                    type: int
                    description: Apperio identifier for the e-billing invoice
                    example: 12345
                    readOnly: true
                  law_firm_id:
                    type: int
                    description: Apperio identifier for the law firm
                    example: 12345
                    readOnly: true
                  law_firm_reference:
                    type: string
                    description: >-
                      The law firm's reference for the invoice. Also known as
                      the invoice number.
                    example: LF-INV-12345
                  service_provider_type:
                    type: string
                    description: The type of service provider that submitted the invoice.
                    example: legal
                    enum:
                      - legal
                      - accountancy
                  status: *ref_10
                  status_changed_automatically:
                    type: boolean
                    description: >
                      Indicates whether the status was changed automatically by
                      Apperio.

                      If `false`, the status was changed manually by a user.


                      Status can be changed automatically by Apperio when an
                      invoice was queried

                      for a certain number of days and no action was taken.
                      Apperio will then

                      automatically change the status to `cancelled`.
                    example: true
                  void_queried_at:
                    type: string
                    format: date-time
                    description: >
                      Capabilities: LAW_FIRM


                      The date and time the invoice will be voided after being
                      queried

                      for a certain number of days.
                    example: '2021-01-01T00:00:00Z'
                  void_queried_in_days:
                    type: integer
                    nullable: true
                    description: >
                      Capabilities: LAW_FIRM


                      Number of days, counting from the current date, after
                      which the invoice

                      will be voided automatically if it remains in the
                      `queried` status.


                      It is a dynamic field, calculated as the difference
                      between

                      `void_queried_at` and the current date.


                      Only populated if the invoice is in the `queried` status.
                    example: 30
                  has_been_ebilled:
                    type: boolean
                    description: >
                      Indicates whether the invoice has been e-billed.

                      This is `true` for all invoices that are not in the
                      `draft` status.
                    example: true
                  has_breakdown:
                    type: boolean
                    description: >
                      Indicates whether the invoice has a breakdown of fees and
                      disbursements.

                      This is `true` for invoices where the law firm has
                      provided a breakdown

                      of fees and disbursements, either via a Data File Uploader
                      or a LEDES file.


                      In case of the DFU, the data must also match the values
                      entered for the invoice.
                    example: true
                  custom_upload_id:
                    type: int
                    description: >
                      The identifier for the custom upload that represents the
                      LEDES file

                      used to create the invoice.
                    example: 12345
                  date:
                    type: string
                    format: date
                    description: >
                      The date the invoice was created in the service provider's
                      system.
                    example: '2021-01-01'
                  tax_date:
                    type: string
                    format: date
                    description: |
                      The date that should be used for tax purposes.
                    example: '2021-01-01'
                  tax_type:
                    type: string
                    description: |
                      The type of tax that should be applied to the invoice.
                    example: VAT
                  billing_start_date:
                    type: string
                    format: date
                    description: >
                      The start date of the billing period covered by the
                      invoice.
                    example: '2021-01-01'
                  billing_end_date:
                    type: string
                    format: date
                    description: |
                      The end date of the billing period covered by the invoice.
                    example: '2021-01-31'
                  currency:
                    allOf:
                      - *ref_4
                    description: >
                      ISO 4217 Three letter currency code of the currency that
                      the invoice is billed in.
                  net_fees:
                    type: string
                    format: decimal
                    description: >
                      The total amount of fees billed on the invoice, excluding
                      tax.
                    example: '1000.00'
                  net_disbursements:
                    type: string
                    format: decimal
                    description: >
                      The total amount of disbursements billed on the invoice,
                      excluding tax.
                    example: '100.00'
                  net_total:
                    type: string
                    format: decimal
                    description: >
                      The total amount billed (fees + disbursements) on the
                      invoice, excluding tax.
                    example: '1100.00'
                  tax_total:
                    type: string
                    format: decimal
                    description: |
                      The total amount of tax billed on the invoice.
                    example: '220.00'
                  total:
                    type: string
                    format: decimal
                    description: |
                      The total amount billed on the invoice, including tax.
                    example: '1320.00'
                  matters:
                    type: array
                    items:
                      type: object
                      description: |
                        The invoice matter details
                      properties:
                        engagement_id:
                          type: int
                          description: >
                            The Apperio identifier of the matter that the
                            invoice is associated with.
                          example: 12345
                        client_id:
                          type: int
                          description: >
                            The Apperio identifier of the client that the
                            invoice is associated with.
                          example: 12345
                        law_firm_reference:
                          type: string
                          description: |
                            The law firm reference for the matter.
                          example: '12345'
                        name:
                          type: string
                          description: |
                            The name of the matter.
                          example: Land Aquisition
                        billing_entity:
                          type: string
                          description: >
                            The name of the entity that the invoice is billed
                            to.
                          example: Acme Corporation
                        net_fees:
                          type: string
                          format: decimal
                          description: >
                            The total amount of fees billed on the invoice,
                            excluding tax.
                          example: '1100.00'
                        net_disbursements:
                          type: string
                          format: decimal
                          description: >
                            The total amount of disbursements billed on the
                            invoice, excluding tax.
                          example: '220.00'
                    description: |
                      Capabilities: LAW_FIRM

                      The matters that the invoice is associated with.
                  matter_ids:
                    type: array
                    items:
                      type: integer
                    description: >
                      The Apperio identifiers of the matters that the invoice is
                      associated with.
                    example:
                      - 12345
                      - 67890
                  client_id:
                    type: int
                    description: >
                      The Apperio identifier of the client that the invoice is
                      associated with.
                    example: 12345
                  billing_entity:
                    type: string
                    description: |
                      The name of the entity that the invoice is billed to.
                    example: Acme Corporation
                  document:
                    allOf:
                      - &ref_11
                        type: object
                        description: >
                          A `document` referenced from the invoice or credit
                          note. Use the document management APIs to retrieve the
                          full document details.
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: |
                              The Apperio identifier of the document object.
                            example: 123e4567-e89b-12d3-a456-426614174000
                          version:
                            type: int
                            description: |
                              The `version` of the document.
                            example: 123
                          filename:
                            type: string
                            description: |
                              The name of the file.
                            example: Invoice.pdf
                    description: |
                      The PDF file attached to the invoice.
                  credit:
                    type: object
                    description: |
                      Credit notes associated with an invoice.
                    properties:
                      id:
                        type: int
                        description: |
                          The Apperio identifier of the credit note.
                        example: 12345
                      law_firm_id:
                        type: int
                        description: >
                          The Apperio identifier of the law firm that the credit
                          note is associated with.
                        example: 12345
                      law_firm_reference:
                        type: string
                        description: |
                          The law firm reference for the credit note.
                        example: '12345'
                      invoice_id:
                        type: int
                        description: >
                          The Apperio identifier of the e-billing invoice that
                          the credit note is associated with.
                        example: 12345
                      is_cancelled:
                        type: boolean
                        description: |
                          Whether the credit note has been cancelled.
                        example: false
                      date:
                        type: string
                        format: date
                        description: |
                          The date the credit note was created.
                        example: '2020-01-01'
                      refunded_fee:
                        type: string
                        format: decimal
                        description: |
                          The total amount of fees refunded on the credit note.
                        example: '1100.00'
                      refunded_disbursement:
                        type: string
                        format: decimal
                        description: >
                          The total amount of disbursements refunded on the
                          credit note.
                        example: '220.00'
                      refunded_tax:
                        type: string
                        format: decimal
                        description: |
                          The total amount of tax refunded on the credit note.
                        example: '220.00'
                      has_been_ebilled:
                        type: boolean
                        description: |
                          Whether the credit note has been e-billed.
                        example: false
                      document:
                        allOf:
                          - *ref_11
                        description: |
                          The PDF file attached to the credit note.
                  source:
                    type: string
                    description: |
                      The source of the invoice.
                    enum:
                      - ledes
                      - pdf
                    example: ledes
                  approved_email_sent_at:
                    type: string
                    format: date-time
                    description: >
                      The date and time the email was sent to the business to
                      notify them that

                      the invoice has been approved.
                    example: '2021-01-01T00:00:00Z'
                  approved_email_sent_to:
                    type: string
                    description: |
                      The email address the email was sent to.
                    example: john.smith@eample.com
                  is_manual:
                    type: boolean
                    description: >
                      Indicates whether the invoice was created by a "manual"
                      law firm.
                    example: false
                  payable:
                    type: string
                    format: decimal
                    description: |
                      The total amount that is payable on the invoice.
                    example: '1320.00'
                  approval_query:
                    type: object
                    description: |
                      A record of status changes for an e-billing invoice.
                    properties:
                      created:
                        type: string
                        format: date-time
                        description: |
                          The date and time the status change was recorded.
                        example: '2021-01-01T00:00:00Z'
                      approver: &ref_13
                        type: object
                        description: |
                          A user who can approve an invoice.
                        properties:
                          id:
                            type: int
                            description: |
                              The Apperio identifier of the approver.
                            example: 12345
                          first_name:
                            type: string
                            description: |
                              The first name of the approver.
                            example: John
                          last_name:
                            type: string
                            description: |
                              The last name of the approver.
                            example: Doe
                          email:
                            type: string
                            description: |
                              The email address of the approver.
                            example: john.doe@example.com
                      client_name:
                        type: string
                        description: >
                          The name of the client that the invoice was submitted
                          to, as set on the invoice

                          at the time of the status change.
                        example: Acme Corporation
                      notes:
                        type: string
                        description: |
                          Any notes that were added to the status change.
                        example: Looks good to me!
                  permissions:
                    type: object
                    description: |
                      The permissions that the user has for the invoice.
                    properties:
                      can_edit_data:
                        type: boolean
                        description: >
                          Indicates whether the user can edit the data on the
                          invoice.
