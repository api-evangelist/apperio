openapi: 3.0.3
info:
  title: Apperio API Documentation
  description: >
    # Introduction


    The Apperio API allows law firms and businesses to enhance their internal

    business intelligence capabilities. These APIs are designed to efficiently
    support

    interactive reporting and are used to power the Apperio application.


    # API Versioning


    Major versions will come with semantic versioning guarantees.

    That is to say, there will be no breaking changes in minor version upgrades.

    In particular the following changes will only be introduced in major
    versions of the API:

      * Changing the meaning of an entity or attribute
      * Renaming entities or attributes
      * Adding new required attributes in the request
      * Changing the URI of the endpoint
      * Removing a URI endpoint
      * Adding further choices to an enumeration
      * Removing choices from an enumeration in the request

    Further endpoints and entity attributes can be added in minor versions. It's
    expected that

    clients should ignore any attributes that are returned in the response that
    they weren't

    aware of. When a multiple option attribute isn't modelled with an explicit
    enumeration the

    integrating clients should also ensure that they can handle unknown
    responses.


    Each previous version of the API will be supported for 6 months after the
    release of a new

    major version. A migration plan will be published for each major version to
    inform integrators

    of breaking changes.


    ### What is likely to change in the next major version of the API?


    #### Service Versioning


    Each endpoint will include the version and service name. Endpoints will have
    the following format:


    `/api/v[MAJOR VERSION NUMBER]/[SERVICE_NAME]/[ENDPOINT NAME]`


    Hence in version 2:


    * `/api/v1/filter/invoices/` will change to `/api/v2/filter/invoices/`

    * `/api/v1/analytics/` will change to `/api/v2/analytics/analytics/`


    #### Matter / Engagement


    The terms matter and engagement are used interchangeably in the current
    version. This

    reflects historical usage in the product. References to `engagement` will be
    replaced

    with `matter` in future versions.


    # Change Log for Version 1.5


    #### v1.5

    * Updated engagement and invoice filter endpoints parameters documentation

    * Added documentation for some ebilling endpoints


    #### v1.4

    * Added basic information about the matter header endpoint


    #### v1.3

    * Update rate limits

    * Fix analytics URL and auhorization header


    #### v1.2

    * Key Management

    * HTTP 429 response

    * Versioning moved from service to global API version

    * Glossary definitions


    #### v1.1

    * Matter Tag Set Discovery Endpoint


    #### v1.0

    * Versioning Strategy

    * Glossary


    #### v0.2


    * Invoice discovery endpoint.

    * Null choice filter.

    * Fair usage policy.

    * Capabilities for law firm and business users.


    #### v0.1


    * Filter resource discovery API.


    # Authentication


    All endpoints require that you be authenticated. To become authenticated

    you will need to create an API Key from the profile page in the application,

    and supply it within the Authentication header in the following format:


    ```

    curl -X GET "https://sandbox.apperio.com/api/v1/data/analytics/"

    -H "Authorization: Token <TOKEN VALUE>"

    ```


    Please contact Customer Success to enable API access on your account.


    All requests that are made to the API will be made with the capabilities of

    the user generating the token. It's important that you ensure that the
    access

    token is kept secret and not shared outside of your organisation. In
    particular

    be mindful not to check it in to code or configuration files where it can be

    seen in plain text. We recommend cycling the API key at least every 12
    months.

    If you suspect that the key may been leaked then disable it immediately in
    the profile

    section and inform Apperio. Apperio do not have access to these tokens;
    hence, you

    will need to generate a new token if it's lost.


    You should consider that this token grants access to anything that the
    associated

    user can access on the website. This will allow you to take advantage of
    future

    endpoints without further configuration. With this in mind be careful to
    give this

    account the minimum set of privileges required for your integration.


    # Pagination and Ordering


    Pagination endpoints allow ordered data to be brought back in chunks.
    Pagination

    is usually limited to data discovery and information feed endpoints. If
    available

    `PAGINATION` will be listed in the *Capabilities* section of the endpoint.
    The response

    can be ordered by setting the `ordering` query parameter. This takes a URL
    encoded

    comma separated list of fields to order by. If a field is prepended by a `-`
    then

    the ordering is reversed. For example if I wished to order by
    `last_worked_at_law_firm`

    with the latest results first and then by `engagement_id` I would add the
    following

    to the query:


    ```

    ordering=-last_worked_at_law_firm%2Cengagement_id

    ```


    The number of results returned on a page is controlled by the `page-size`
    parameter.

    It defaults to 50 across the API and will be capped to avoid large one-time
    data

    extractions that may be prone to fail.


    ```

    ordering=-last_worked_at_law_firm%2Cengagement_id&page-size=10

    ```


    When there are more items to return than can be shown on one page then a
    pagination

    object is returned in the response:


    ```json

    "pagination": {
      "next": "https://sandbox.apperio.com/api/v1/filter/engagements/?ordering=-last_worked_at_law_firm%2Cengagement_id&page=dj0yJnA9MiZnPWJiNTdmMDg2NzI2YzQxYWRhZmI4NmZjMjRlODI5ZTIz&page-size=10",
      "previous":null
      "nextPage":"dj0yJnA9MiZnPWJiNTdmMDg2NzI2YzQxYWRhZmI4NmZjMjRlODI5ZTIz",
      "previousPage":null
    }

    ```


    The `nextPage` and `previousPage` provide a token that can be passed to the
    `page` parameter to

    navigate to that page. `null` indicates that there is no further data in
    that direction. The `next` and

    `previous` attributes provide HATEOAS style links to navigate to the next
    and previous page.


    # Business and Law Firm Capabilities


    Apperio is a double sided platform that allows law firms and businesses to
    collaborate. The Apperio API is available

    to both businesses and law firms; however some requests are only available
    to one side of the platform. The capabilities

    section for each endpoint details which side can access each API call.


    The access token serves to identify the organisation (law firm or business).
    Resources in each request will be restricted

    to those available to that organisation.


    # Acceptable usage policy


    * Please respect the usage limits. If you think you are likely to exceed
    them then please contact Customer Success.
      The standard usage limits are:
      - Requests from the same authorization token should be made in series; not in parallel
      - Maximum of 10000 requests in an hour
    * The API is designed to allow you to provide innovative services that
    incorporate data that's held in Apperio.

    They should not be used as a means of duplicating that data.

    * If you're unsure about the most effective way to integrate with Apperio to
    support your business case then

    please contact Customer Success so we can take you through different
    solutions.

    * Your application must be able to handle a `HTTP 429 Too Many Requests`
    response.

    * Apperio reserve the right to suspend API access if usage contravenes this
    policy. 


    # Glossary


    The following terminology is used throughout the API


    | Term           | Description   |

    | -------------  | ------------- |

    | Billable       | The billable amount includes both entries that have been
    billed and the potential contribution from work that's in progress. |

    | Billed         | The amount that has already been invoiced. |

    | Budget         | The estimated budgeted amount for hourly matters. For
    fixed matters this represents the fixed cost. This also represents the cap
    for capped matters (see Fee Structure). |

    | Client         | The client of the law firm. Multiple law firm clients can
    be associated with the one Apperio business. |

    | Disbursement   | disbursements, hard cost and soft costs. |

    | Engagement     | (see Matter) The term `engagement` is Apperio internal
    terminology for `matter` and will be replaced with `matter` in the next
    major version. |

    | Fee            | The charge for work undertaken by the law firm. |

    | Fee Structure  | How the matter will be billed. Apperio supports Hourly,
    Capped and Fixed Fee structures. |

    | Matter         | A law firm case. |

    | Practice Group | The division in the law firm conducting the work. |

    | Wip            | Work that has been carried out but not yet billed on the
    matter (Work in progress). |
servers:
  - url: https://sandbox.apperio.com/
  - url: https://app.apperio.com/
tags:
  - name: Filter
    description: >
      The filter endpoints provide resource discovery in Apperio. This has

      two basic mechanisms. Firstly there are the resource discovery endpoints.

      These are:
        * `/api/v1/filter/engagements/`
        * `/api/v1/filter/invoices/`
        * `/api/v1/filter/matter-tags/`

      These endpoints return lists of resource references with decorating
      metadata

      that can be filtered, ordered and paginated.


      Secondly resources may be tagged. The tag management endpoints allow you
      to

      create different groupings of matters


      For those familiar with writing SQL queries, the resource discovery
      endpoints

      can be thought of in a similar way. The `SELECT` section or projection
      clause

      determines which fields are returned. The `WHERE` clause or filter section
      determines

      which records are returned and `ORDER BY` section determines the order
      that they are

      returned in. Ordering and pagination is covered in the section above.
      Below, we will

      take each of the other sections in turn to show how these are handled on
      these endpoints. 


      **Data Projection**


      The filter API is designed to provide broad information about resources
      for easy resource

      discovery. The client can choose which denormalised fields can appear in
      the projection

      clause using the `fields` query parameter. Only the fields listed in this
      query parameter,

      together with any mandatory fields, will be included in the response.

      The field names are URL encoded comma (%2C) separated.


      For example if I wish to bring back the fields `one`, `two` and `three` I
      would query the

      endpoint with:


      ```

      ...?fields=one%2Ctwo%2Cthree

      ```


      And the response will bring back only those fields and any mandatory
      fields (such as the

      identifier for the resource). For example the response may be:


      ```json

      {
        "results": [
          {
              "one": 5000.0,
              "two": 5,
              "three": false
          },
          {
              "one": 86645.23,
              "two": 59541,
              "three": false
          }
        ],
        "pagination": {
            "next": null,
            "previous": null,
            "nextPage": null,
            "previousPage": null
        }
      }

      ```


      The full list of available fields can be seen in the response body for
      that endpoint.


      **Resource Permissions**


      The set of resources that can be discovered in the API is limited to those
      that

      the user generating the token has access to. This can then be filtered
      further

      using explicit filters; resources that the user is not authorized to see
      will not

      be returned.


      **Filtering the data**


      On the resource discovery endpoints the returning data can be filtered

      by each of the fields on the resource. Each field has been associated with

      the type of filter that will make it easier to discover resources. The
      filter

      types are explained below.  


      *Range filters*


      Range filters allow a slice of the data to be selected. They can be used
      to

      select all data less than equal to a value; all data above or equal to a
      value

      or can be combined to return a slice of the data. For example if I have
      the

      field `foo` and wish to return all data between 10000 and 12000 GBP I
      would add

      the filters:


      ```

      ?foo__gte=10000&foo__lte=12000

      ```


      When the field is a monetary field it is assumed that these values will be
      in

      your organisation's base currency and any transactions in another currency
      will

      be subject to a exchange conversion on the rate held for the date of that

      transaction.


      **Text filters**


      Text filters will return all entries that start with the selected value.
      For

      example if I wanted to bring back all matters that started with the name
      'Pricing'

      I would filter on


      ```

      ?law_firm_name__icontains=Pricing

      ```


      These query would bring back matters called both 'Pricing development
      contract'

      and 'Pricing housing development'


      **Choice filters**


      Choice filters allow both exact matching and a selection of values to be
      matched.

      For example, to search for the single value apple I would include:


      ```

      ?bar=apple

      ```


      To bring back both apples, pairs and mangos:


      ```

      ?bar__in=apple%2Cpair%2Cmango

      ```


      Where the field can be null, the `__isnull` filter is provided


      ```

      ?foo__isnull=true

      ```


      If you want to incorporate null as one of the choices then `__is_null`

      and `__in` on the same field returns the _union_ of those resources that

      match one of those values and those resources where this field isn't set:


      ```

      ?foo__isnull=true&foo__in=cucumber%2Ctomato

      ```


      **Boolean filters**


      Boolean filters filter out data where a field is true or false. For
      example, if

      I want to bring back matters that I haven't yet shared with the business.


      ```

      ?is_shared=false

      ```
  - name: Analytics
    description: |
      A set of non resource based endpoints that power various components
      within Apperio. These endpoints primarily support discovery and data
      investigation.
  - name: Matter information
    description: |
      A set of endpoints returning information about a specific matter.
  - name: E-billing
    description: >
      The e-billing endpoints provide access to the e-billing invoices in
      Apperio.

      They allow you to retrieve information about the invoices and the

      approval workflow, and also to approve and reject invoices.
  - name: Users
    description: >
      The users endpoints allow you to manage your API tokens. Tokens are used
      to

      authenticate requests to the Apperio API. You can list your existing
      tokens,

      delete tokens that are no longer needed, and activate or deactivate tokens

      without permanently removing them.
paths:
  /api/v1/data/analytics:
    get:
      summary: Analytics
      description: |
        Capabilities: BUSINESS, LAW_FIRM, PAGINATION

        Denormalised data is split along one or more "dimensions". Each
        dimension supplied segments the requested data over that dimension.
        For example, if you were interested in finding your total WIP, you
        would simply supply `wip` as a metric. If you were interested in
        finding this per law firm, you would also supply `law_firm_id` as a
        dimension, and if you wanted this over time, you would supply
        `date,law_firm_id`.
      parameters:
        - name: start_date
          in: query
          required: true
          schema: &ref_0
            type: string
            enum:
              - NdaysAgo
              - today
              - dd-mm-yyyy
          description: Inclusive date to gather data from
          example: 90daysAgo
        - name: end_date
          in: query
          required: true
          schema: *ref_0
          description: Inclusive date to gather data to
          example: today
        - name: metrics
          in: query
          schema:
            type: string
            enum:
              - hours_worked_wip
              - hours_worked_billed
              - hours_worked
              - hours_worked_wip_no_budget
              - hours_worked_billed_no_budget
              - hours_worked_no_budget
              - fees_worked_billed
              - fees_worked_wip
              - fees_worked
              - fees_worked_billed_no_budget
              - fees_worked_wip_no_budget
              - fees_worked_no_budget
              - rate
              - rate_no_budget
              - rate_percentile
              - rate_percentile_no_budget
              - rate_min
              - rate_min_no_budget
              - rate_max
              - rate_max_no_budget
              - rate_avg
              - rate_avg_no_budget
              - fees_wip
              - fees_wip_no_budget
              - fees_billed
              - fees_billed_no_budget
              - fees_billable
              - fees_billable_no_budget
              - fees_write_down_billed
              - fees_write_down_wip
              - fees_write_down
              - fees_activity_cost
              - fees_write_down_billed_no_budget
              - fees_write_down_wip_no_budget
              - fees_write_down_no_budget
              - fees_activity_cost_no_budget
              - disbursements_wip
              - disbursements_wip_no_budget
              - disbursements_billed
              - disbursements_billed_no_budget
              - disbursements_billable
              - disbursements_billable_no_budget
              - disbursements_write_down_billed
              - disbursements_write_down_wip
              - disbursements_write_down
              - disbursements_activity_cost
              - disbursements_write_down_billed_no_budget
              - disbursements_write_down_wip_no_budget
              - disbursements_write_down_no_budget
              - disbursements_activity_cost_no_budget
              - write_down
              - write_down_no_budget
              - activity_cost
              - activity_cost_no_budget
              - engagement_opened
              - wip
              - wip_no_budget
              - billed
              - billed_no_budget
              - billable
              - billable_no_budget
              - engagement_worked
          description: CSV of metrics to include in the results
          required: true
          example: wip,billed
        - name: dimensions
          in: query
          schema:
            type: string
            enum:
              - date
              - week
              - month
              - quarter
              - year
              - age
              - engagement_id
              - fee_earner_id
              - fee_earner_role_id
              - standard_role_id
              - law_firm_id
              - business_id
              - currency
              - folder_id
              - pass_through
              - team_id
              - fee_structure
              - standard_fee_structure_id
              - business_matter_type_id
              - law_firm_currency
              - business_currency
              - engagement_currency
              - expense_type_id
              - invoice_id
              - ebilling_invoice_id
              - business_config_id
              - tag_id
          description: CSV of dimensions to apply to the query
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: The number of items to return
        - name: engagement_id
          in: query
          schema:
            type: int
            description: Filter by a single matter
        - name: engagement_id__in
          in: query
          schema:
            type: string
            description: >
              Comma separated list of Apperio matter identifiers. The commas
              must

              be URL encoded (%2C)
            example: 25%2C66
        - name: business_config_id
          in: query
          schema:
            type: int
            description: >
              Filter matters to the one Apperio business-law firm connection
              identifier
        - name: business_config_id__in
          in: query
          schema:
            type: string
            description: >
              Comma separated list of Apperio business-law firm connection
              identifiers.

              The commas must be URL encoded (%2C)
        - name: business_id
          in: query
          schema:
            type: int
            description: |
              Filter matters to the one business
        - name: business_matter_type_id__isnull
          in: query
          schema:
            type: boolean
            description: |
              Filter matters where the matter type isn't set
        - name: business_matter_type_id__in
          in: query
          schema:
            type: string
            description: >
              Comma separated list of Apperio business matter type identifiers.
              The commas must

              be URL encoded (%2C)
        - name: fee_structure
          in: query
          schema:
            type: int
            description: |
              Filter matters to the one fee structure
        - name: fee_structure__in
          in: query
          schema:
            type: string
            example: fixed%2Ccapped
            description: |
              Comma separated list of fee_structures. The commas must
              be URL encoded (%2C)
        - name: folder_id__isnull
          in: query
          schema:
            type: boolean
            description: |
              Filter matters that haven't been assigned to a folder
        - name: folder_id__in
          in: query
          schema:
            type: string
            description: |
              Comma separated list of folders. The commas must
              be URL encoded (%2C)
        - name: law_firm_id
          in: query
          schema:
            type: int
            description: |
              Filter matters to the one firm
        - name: law_firm_id__in
          in: query
          schema:
            type: string
            description: |
              Comma separated list of firms. The commas must
              be URL encoded (%2C)
        - name: pass_through
          in: query
          schema:
            type: boolean,
            description: >-
              Filter matters where costs are(n't) passed through to the end
              client
        - name: tag_id__in
          in: query
          schema:
            type: string
            description: >
              Comma separated list of tags in the form of
              `[TAG_SET_ID]__[TAG_ID]`

              or `[TAG_SET_ID]__isnull`. Those tags with the same tag set
              identifier

              will first be combined with an OR and then the groups will be
              combined

              with an AND. That is, matters need to belong to at least one tag
              per

              tag set group. `[TAG_SET_ID]__isnull` corresponds to matters that
              have

              not been assigned any tag in `TAG_SET_ID`.

              The commas must be URL encoded (%2C).
            example: 2__78%2C2__80%2C5__isnull
        - name: team_id__isnull
          in: query
          schema:
            type: int
            description: |
              Filter matters that haven't been assigned to a business team
        - name: team_id__in
          in: query
          schema:
            type: string
            description: |
              Comma separated list of business teams. The commas must
              be URL encoded (%2C)
      tags:
        - Analytics
      responses:
        '200':
          description: |
            Analytic data
          content:
            application/json:
              schema:
                type: object
                properties:
                  analytics:
                    type: object
                    properties:
                      query:
                        type: object
                        description: |
                          Contains the data used when querying analytics.
                        properties:
                          start_date:
                            type: string
                            example: 90daysAgo
                          end_date:
                            type: string
                            example: today
                          limit:
                            type: integer
                            nullable: true
                            example: null
                          ordering:
                            type: string
                            nullable: true
                            example: null
                          currency:
                            type: string
                            nullable: true
                            example: null
                      columns:
                        type: array
                        items:
                          type: string
                        example:
                          - date
                          - law_firm_id
                          - wip
                        description: >
                          The name of each column, dimensions followed by
                          metrics.
                      column-types:
                        type: array
                        items:
                          type: string
                          enum:
                            - DIMENSION
                            - METRIC
                          example:
                            - DIMENSION
                            - DIMENSION
                            - METRIC
                        description: |
                          Is the value at index a dimension or metric value
                      column-data-types:
                        type: array
                        items:
                          type: string
                          enum:
                            - CURRENCY
                            - INT
                            - FLOAT
                            - DATE
                            - STRING
                            - COUNT
                            - BOOL_COUNT
                            - BOOL
                          example:
                            - DATE
                            - INT
                            - CURRENCY
                        description: >
                          The data type of the value at each index within thr
                          row
                      rows:
                        type: array
                        items:
                          type: array
                        description: >
                          Each array contains the requested dimensions followed
                          by metrics.
                        example:
                          - - 01-03-2020
                            - 1
                            - 100
                          - - 01-03-2020
                            - 2
                            - 500
                          - - 02-03-2020
                            - 1
                            - 400
                      pagination:
                        type: object
                        properties:
                          next:
                            type: string
                            nullable: true
                            description: location of the next page
                            example: aAbBcCdDeEfFgG
                          previous:
                            type: string
                            nullable: true
                            description: location of the previous page
                            example: null
                          nextPage:
                            type: string
                            nullable: true
                            description: value of the next page paginator
                            example: >-
                              https://app.apperio.com/api/v1/analytics?page=aAbBcCdDeEfFgG
                          previousPage:
                            type: string
                            nullable: true
                            description: value of the previous page paginator
                            example: null
        '400':
          description: |
            Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                  description: |
                    Error messages
  /api/v1/filter/engagements/:
    get:
      summary: Discover matter resources
      description: >
        Capabilities: BUSINESS, LAW_FIRM, PAGINATION

        Matter discovery endpoint. The returned projection can be controlled by
        setting the

        `fields` parameter to just return the fields you require. Results can be
        ordered and

        paginated.
      tags:
        - Filter
      parameters:
        - name: fields
          in: query
          required: true
          schema:
            type: string
            example: engagement_id%2Cbilled%2Cearliest_work_date
            description: >
              The filter API is designed to provide broad information about
              resources for easy resource

              discovery. The client can choose which denormalised fields can
              appear in the projection clause.

              Only the selected fields will be included in the response. Fields
              are comma

              separated. The commas will need to be URL encoded (%2C)


              The full list of available fields depends on the type of the
              user's organisation (business or firm).

              Most of the fields are available to all users, but some are
              restricted.


              | Field name | Description | Business | Firm |

              |------------|-------------|:--------:|:----:|

              | `engagement_id` | Apperio ID of a matter | ✅ | ✅ |

              | `business_engagement_name` | Business name of a matter | ✅ | ✅ |

              | `law_firm_engagement_name` | Law firm name of a matter | ✅ | ✅ |

              | `accessible` | Is the matter accessible? | ❌ | ✅ |

              | `created_at` | When was the matter created in Apperio | ✅ | ✅ |

              | `currency` | The matter currency | ✅ | ✅ |

              | `earliest_work_date` | The date of the earliest recorded time
