        - name: ordering
          in: query
          schema: &ref_3
            type: string
            example: ordering=-last_worked_at_law_firm%2Cengagement_id
            description: >
              How the results should be ordered.


              This takes a URL encoded comma separated list of fields to order
              by.

              If a field is prepended by a `-` then the ordering is reversed.
              For example if I wished

              to order by `last_worked_at_law_firm` with the latest results
              first and then by `engagement_id`

              I would add `ordering=-last_worked_at_law_firm%2Cengagement_id` to
              the query
