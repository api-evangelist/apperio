openapi: 3.2.0
info:
  title: Apperio API Documentation E Billing API
  description: '# Introduction


    The Apperio API allows law firms and businesses to enhance their internal

    business intelligence capabilities.'
servers:
- url: https://sandbox.apperio.com/
- url: https://app.apperio.com/
tags:
- name: E-billing
  description: 'The e-billing endpoints provide access to the e-billing invoices in Apperio.

    They allow you to retrieve information about the invoices and the

    approval workflow, and also to approve and reject invoices.'
paths:
  /api/v1/ebilling/invoices/{invoice-id}/:
    get:
      summary: Get the invoice details
      description: 'Capabilities: BUSINESS, LAW_FIRM'
      tags:
      - E-billing
      parameters:
      - name: invoice-id
        in: path
        schema:
          type: int
          description: Invoice ID
          example: 12345
      responses:
        '200':
          description: 'Invoice details

            '
          content:
            application/json:
              schema:
                type: object
                description: 'An e-billing invoice that has been submitted to Apperio for processing.

                  '
                required:
                - name
                properties:
                  id:
                    type: int
                    description: Apperio identifier for the e-billing invoice
                    example: 12345
                    readOnly: true
                  law_firm_id:
                    type: int
                    description: Apperio identifier for the law firm
                    example: 12345
                    readOnly: true
                  law_firm_reference:
                    type: string
                    description: The law firm's reference for the invoice. Also known as the invoice number.
                    example: LF-INV-12345
                  service_provider_type:
                    type: string
                    description: The type of service provider that submitted the invoice.
                    example: legal
                    enum:
                    - legal
                    - accountancy
                  status:
                    type: string
                    example: ebilled
                    description: 'Tracks the progress of an invoice in Apperio:

                      * `draft`: draft invoice that hasn''t yet been billed

                      * `queried`: Invoice that has been billed but queried by the business

                      * `ebilled`: Billed but not yet paid

                      * `in_review`: Business are reviewing the invoice

                      * `approved`: Business has approved

                      * `paid`: Business has paid

                      * `cancelled`: The invoice has been cancelled (AKA voided)

                      '
                    enum:
                    - draft
                    - queried
                    - ebilled
                    - in_review
                    - approved
                    - paid
                    - cancelled
                  status_changed_automatically:
                    type: boolean
                    description: 'Indicates whether the status was changed automatically by Apperio.

                      If `false`, the status was changed manually by a user.


                      Status can be changed automatically by Apperio when an invoice was queried

                      for a certain number of days and no action was taken. Apperio will then

                      automatically change the status to `cancelled`.

                      '
                    example: true
                  void_queried_at:
                    type: string
                    format: date-time
                    description: 'Capabilities: LAW_FIRM


                      The date and time the invoice will be voided after being queried

                      for a certain number of days.

                      '
                    example: '2021-01-01T00:00:00Z'
                  void_queried_in_days:
                    type:
                    - integer
                    - 'null'
                    description: 'Capabilities: LAW_FIRM


                      Number of days, counting from the current date, after which the invoice

                      will be voided automatically if it remains in the `queried` status.


                      It is a dynamic field, calculated as the difference between

                      `void_queried_at` and the current date.


                      Only populated if the invoice is in the `queried` status.

                      '
                    example: 30
                  has_been_ebilled:
                    type: boolean
                    description: 'Indicates whether the invoice has been e-billed.

                      This is `true` for all invoices that are not in the `draft` status.

                      '
                    example: true
                  has_breakdown:
                    type: boolean
                    description: 'Indicates whether the invoice has a breakdown of fees and disbursements.

                      This is `true` for invoices where the law firm has provided a breakdown

                      of fees and disbursements, either via a Data File Uploader or a LEDES file.


                      In case of the DFU, the data must also match the values entered for the invoice.

                      '
                    example: true
                  custom_upload_id:
                    type: int
                    description: 'The identifier for the custom upload that represents the LEDES file

                      used to create the invoice.

                      '
                    example: 12345
                  date:
                    type: string
                    format: date
                    description: 'The date the invoice was created in the service provider''s system.

                      '
                    example: '2021-01-01'
                  tax_date:
                    type: string
                    format: date
                    description: 'The date that should be used for tax purposes.

                      '
                    example: '2021-01-01'
                  tax_type:
                    type: string
                    description: 'The type of tax that should be applied to the invoice.

                      '
                    example: VAT
                  billing_start_date:
                    type: string
                    format: date
                    description: 'The start date of the billing period covered by the invoice.

                      '
                    example: '2021-01-01'
                  billing_end_date:
                    type: string
                    format: date
                    description: 'The end date of the billing period covered by the invoice.

                      '
                    example: '2021-01-31'
                  currency:
                    allOf:
                    - type: string
                      example: GBP
                      description: ISO 4217 Three letter currency code
                      minLength: 3
                      maxLength: 3
                    description: 'ISO 4217 Three letter currency code of the currency that the invoice is billed in.

                      '
                  net_fees:
                    type: string
                    format: decimal
                    description: 'The total amount of fees billed on the invoice, excluding tax.

                      '
                    example: '1000.00'
                  net_disbursements:
                    type: string
                    format: decimal
                    description: 'The total amount of disbursements billed on the invoice, excluding tax.

                      '
                    example: '100.00'
                  net_total:
                    type: string
                    format: decimal
                    description: 'The total amount billed (fees + disbursements) on the invoice, excluding tax.

                      '
                    example: '1100.00'
                  tax_total:
                    type: string
                    format: decimal
                    description: 'The total amount of tax billed on the invoice.

                      '
                    example: '220.00'
                  total:
                    type: string
                    format: decimal
                    description: 'The total amount billed on the invoice, including tax.

                      '
                    example: '1320.00'
                  matters:
                    type: array
                    items:
                      type: object
                      description: 'The invoice matter details

                        '
                      properties:
                        engagement_id:
                          type: int
                          description: 'The Apperio identifier of the matter that the invoice is associated with.

                            '
                          example: 12345
                        client_id:
                          type: int
                          description: 'The Apperio identifier of the client that the invoice is associated with.

                            '
                          example: 12345
                        law_firm_reference:
                          type: string
                          description: 'The law firm reference for the matter.

                            '
                          example: '12345'
                        name:
                          type: string
                          description: 'The name of the matter.

                            '
                          example: Land Aquisition
                        billing_entity:
                          type: string
                          description: 'The name of the entity that the invoice is billed to.

                            '
                          example: Acme Corporation
                        net_fees:
                          type: string
                          format: decimal
                          description: 'The total amount of fees billed on the invoice, excluding tax.

                            '
                          example: '1100.00'
                        net_disbursements:
                          type: string
                          format: decimal
                          description: 'The total amount of disbursements billed on the invoice, excluding tax.

                            '
                          example: '220.00'
                    description: 'Capabilities: LAW_FIRM


                      The matters that the invoice is associated with.

                      '
                  matter_ids:
                    type: array
                    items:
                      type: integer
                    description: 'The Apperio identifiers of the matters that the invoice is associated with.

                      '
                    example:
                    - 12345
                    - 67890
                  client_id:
                    type: int
                    description: 'The Apperio identifier of the client that the invoice is associated with.

                      '
                    example: 12345
                  billing_entity:
                    type: string
                    description: 'The name of the entity that the invoice is billed to.

                      '
                    example: Acme Corporation
                  document:
                    allOf:
                    - type: object
                      description: 'A `document` referenced from the invoice or credit note. Use the document management APIs to retrieve the full document details.

                        '
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: 'The Apperio identifier of the document object.

                            '
                          example: 123e4567-e89b-12d3-a456-426614174000
                        version:
                          type: int
                          description: 'The `version` of the document.

                            '
                          example: 123
                        filename:
                          type: string
                          description: 'The name of the file.

                            '
                          example: Invoice.pdf
                    description: 'The PDF file attached to the invoice.

                      '
                  credit:
                    type: object
                    description: 'Credit notes associated with an invoice.

                      '
                    properties:
                      id:
                        type: int
                        description: 'The Apperio identifier of the credit note.

                          '
                        example: 12345
                      law_firm_id:
                        type: int
                        description: 'The Apperio identifier of the law firm that the credit note is associated with.

                          '
                        example: 12345
                      law_firm_reference:
                        type: string
                        description: 'The law firm reference for the credit note.

                          '
                        example: '12345'
                      invoice_id:
                        type: int
                        description: 'The Apperio identifier of the e-billing invoice that the credit note is associated with.

                          '
                        example: 12345
                      is_cancelled:
                        type: boolean
                        description: 'Whether the credit note has been cancelled.

                          '
                        example: false
                      date:
                        type: string
                        format: date
                        description: 'The date the credit note was created.

                          '
                        example: '2020-01-01'
                      refunded_fee:
                        type: string
                        format: decimal
                        description: 'The total amount of fees refunded on the credit note.

                          '
                        example: '1100.00'
                      refunded_disbursement:
                        type: string
                        format: decimal
                        description: 'The total amount of disbursements refunded on the credit note.

                          '
                        example: '220.00'
                      refunded_tax:
                        type: string
                        format: decimal
                        description: 'The total amount of tax refunded on the credit note.

                          '
                        example: '220.00'
                      has_been_ebilled:
                        type: boolean
                        description: 'Whether the credit note has been e-billed.

                          '
                        example: false
                      document:
                        allOf:
                        - type: object
                          description: 'A `document` referenced from the invoice or credit note. Use the document management APIs to retrieve the full document details.

                            '
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: 'The Apperio identifier of the document object.

                                '
                              example: 123e4567-e89b-12d3-a456-426614174000
                            version:
                              type: int
                              description: 'The `version` of the document.

                                '
                              example: 123
                            filename:
                              type: string
                              description: 'The name of the file.

                                '
                              example: Invoice.pdf
                        description: 'The PDF file attached to the credit note.

                          '
                  source:
                    type: string
                    description: 'The source of the invoice.

                      '
                    enum:
                    - ledes
                    - pdf
                    example: ledes
                  approved_email_sent_at:
                    type: string
                    format: date-time
                    description: 'The date and time the email was sent to the business to notify them that

                      the invoice has been approved.

                      '
                    example: '2021-01-01T00:00:00Z'
                  approved_email_sent_to:
                    type: string
                    description: 'The email address the email was sent to.

                      '
                    example: john.smith@eample.com
                  is_manual:
                    type: boolean
                    description: 'Indicates whether the invoice was created by a "manual" law firm.

                      '
                    example: false
                  payable:
                    type: string
                    format: decimal
                    description: 'The total amount that is payable on the invoice.

                      '
                    example: '1320.00'
                  approval_query:
                    type: object
                    description: 'A record of status changes for an e-billing invoice.

                      '
                    properties:
                      created:
                        type: string
                        format: date-time
                        description: 'The date and time the status change was recorded.

                          '
                        example: '2021-01-01T00:00:00Z'
                      approver:
                        type: object
                        description: 'A user who can approve an invoice.

                          '
                        properties:
                          id:
                            type: int
                            description: 'The Apperio identifier of the approver.

                              '
                            example: 12345
                          first_name:
                            type: string
                            description: 'The first name of the approver.

                              '
                            example: John
                          last_name:
                            type: string
                            description: 'The last name of the approver.

                              '
                            example: Doe
                          email:
                            type: string
                            description: 'The email address of the approver.

                              '
                            example: john.doe@example.com
                      client_name:
                        type: string
                        description: 'The name of the client that the invoice was submitted to, as set on the invoice

                          at the time of the status change.

                          '
                        example: Acme Corporation
                      notes:
                        type: string
                        description: 'Any notes that were added to the status change.

                          '
                        example: Looks good to me!
                  permissions:
                    type: object
                    description: 'The permissions that the user has for the invoice.

                      '
                    properties:
                      can_edit_data:
                        type: boolean
                        description: 'Indicates whether the user can edit the data on the invoice.

                          '
                        example: true
                      can_edit_document:
                        type: boolean
                        description: 'Indicates whether the user can edit the document attached to the invoice.

                          '
                        example: false
                    example:
                      can_edit_data: true
                      can_edit_document: false
                  capabilities:
                    type: object
                    description: 'The optional features available for the invoice.

                      '
                    properties:
                      has_approval_workflow:
                        type: boolean
                        description: 'Indicates whether the invoice has an approval workflow.

                          '
                        example: true
                    example:
                      has_approval_workflow: true
                  withheld_fees:
                    type: string
                    format: decimal
                    description: 'The total amount of fees that have been withheld from the invoice.


                      Only present on invoices with an approval workflow.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: '100.00'
                  withheld_user:
                    type: object
                    description: 'The user that entered the withheld fees.


                      Only present on invoices with an approval workflow.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    properties:
                      id:
                        type: int
                        description: 'The Apperio identifier of the user.

                          '
                        example: 12345
                      first_name:
                        type: string
                        description: 'The first name of the user.

                          '
                        example: John
                      last_name:
                        type: string
                        description: 'The last name of the user.

                          '
                        example: Smith
                      email:
                        type: string
                        description: 'The email address of the user.

                          '
                        example: john.smith@example.com
                  withheld_date:
                    type: string
                    format: date
                    description: 'The date the withheld fees were entered.


                      Only present on invoices with an approval workflow.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: '2021-01-01'
                  withheld_notes:
                    type: string
                    description: 'The notes entered when the withheld fees were entered.


                      Only present on invoices with an approval workflow.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: Withheld for Qatar tax
                  attributes:
                    type: object
                    description: 'An object mapping attribute names to their values

                      '
                    example:
                      requester_name: Jane Doe
                      requester_email: jane.doe@example.com
        '401':
          description: 'Unauthenticated access - ensure to create a valid API token

            '
        '403':
          description: 'Unauthorized access - Ensure your organisation owns this invoice and

            the user has access to it

            '
        '404':
          description: 'Invoice not found

            '
      operationId: getApiV1EbillingInvoicesByInvoiceId
      x-operation-id-source: derived
  /api/v1/ebilling/invoices/{invoice-id}/status/:
    post:
      summary: Change invoice status
      description: 'Capabilities: BUSINESS, LAW_FIRM'
      tags:
      - E-billing
      parameters:
      - name: invoice-id
        in: path
        schema:
          type: int
          description: Invoice ID
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: ebilled
                  description: 'Tracks the progress of an invoice in Apperio:

                    * `draft`: draft invoice that hasn''t yet been billed

                    * `queried`: Invoice that has been billed but queried by the business

                    * `ebilled`: Billed but not yet paid

                    * `in_review`: Business are reviewing the invoice

                    * `approved`: Business has approved

                    * `paid`: Business has paid

                    * `cancelled`: The invoice has been cancelled (AKA voided)

                    '
                  enum:
                  - draft
                  - queried
                  - ebilled
                  - in_review
                  - approved
                  - paid
                  - cancelled
                resolve_queried_notes:
                  type: string
                  description: 'Notes to resolve the queried status

                    '
                  example: We've resolved all the queries on the invoice
                resolve_queried_update_type:
                  type: string
                  description: 'The type of update to the invoice to resolve the queried status

                    The following types are accepted:

                    * `no_change` - Nothing changed

                    * `file_only` - Only the file

                    * `data_only` - Only the data

                    * `file_and_data` - Both the file and the data

                    '
                  enum:
                  - no_change
                  - file_only
                  - data_only
                  - file_and_data
      responses:
        '200':
          description: 'Invoice status

            '
          content:
            application/json:
              schema:
                type: object
                description: 'The response to a request to update the status of an invoice.

                  '
                properties:
                  status:
                    type: string
                    example: ebilled
                    description: 'Tracks the progress of an invoice in Apperio:

                      * `draft`: draft invoice that hasn''t yet been billed

                      * `queried`: Invoice that has been billed but queried by the business

                      * `ebilled`: Billed but not yet paid

                      * `in_review`: Business are reviewing the invoice

                      * `approved`: Business has approved

                      * `paid`: Business has paid

                      * `cancelled`: The invoice has been cancelled (AKA voided)

                      '
                    enum:
                    - draft
                    - queried
                    - ebilled
                    - in_review
                    - approved
                    - paid
                    - cancelled
                  resolve_queried_notes:
                    type: string
                    description: 'Notes about the resolution of any queries on the invoice.

                      '
                    example: All queries resolved.
                  resolve_queried_update_type:
                    type: string
                    description: 'The type of update to the invoice to resolve the queried status

                      The following types are accepted:

                      * `no_change` - Nothing changed

                      * `file_only` - Only the file

                      * `data_only` - Only the data

                      * `file_and_data` - Both the file and the data

                      '
                    enum:
                    - no_change
                    - file_only
                    - data_only
                    - file_and_data
        '401':
          description: 'Unauthenticated access - ensure to create a valid API token

            '
        '403':
          description: 'Unauthorized access - Ensure your organisation owns this invoice and

            the user has access to it

            '
        '404':
          description: 'Invoice not found

            '
      operationId: postApiV1EbillingInvoicesByInvoiceIdStatus
      x-operation-id-source: derived
  /api/v1/ebilling/invoices/{invoice-id}/approval-workflow/:
    get:
      summary: Get information about the invoice's approval workflow
      description: 'Capabilities: BUSINESS'
      tags:
      - E-billing
      parameters:
      - name: invoice-id
        in: path
        schema:
          type: int
          description: Invoice ID
          example: 12345
      responses:
        '200':
          description: 'Invoice approval workflow

            '
          content:
            application/json:
              schema:
                type: object
                description: 'Invoice approval workflow details.

                  '
                properties:
                  invoice_approval_states:
                    type: array
                    description: 'The states that the invoice can be in during the approval workflow.

                      '
                    items:
                      type: object
                      description: 'An invoice approval state

                        '
                      properties:
                        id:
                          type: int
                          description: 'The Apperio identifier of the invoice approval state.

                            '
                          example: 12345
                        approval_state_id:
                          type: int
                          description: 'The Apperio identifier of the approval state.

                            '
                          example: 12345
                        approver:
                          type: object
                          description: 'A user who can approve an invoice.

                            '
                          properties:
                            id:
                              type: int
                              description: 'The Apperio identifier of the approver.

                                '
                              example: 12345
                            first_name:
                              type: string
                              description: 'The first name of the approver.

                                '
                              example: John
                            last_name:
                              type: string
                              description: 'The last name of the approver.

                                '
                              example: Doe
                            email:
                              type: string
                              description: 'The email address of the approver.

                                '
                              example: john.doe@example.com
                        assigned_approver:
                          type: object
                          description: 'A user who can approve an invoice.

                            '
                          properties:
                            id:
                              type: int
                              description: 'The Apperio identifier of the approver.

                                '
                              example: 12345
                            first_name:
                              type: string
                              description: 'The first name of the approver.

                                '
                              example: John
                            last_name:
                              type: string
                              description: 'The last name of the approver.

                                '
                              example: Doe
                            email:
                              type: string
                              description: 'The email address of the approver.

                                '
                              example: john.doe@example.com
                        step:
                          type: int
                          description: 'The step in the approval process.

                            '
                          example: 3
                        reviewed_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'The date and time that this step of the approval process was reviewed

                            (approved, rejected, or queried).


                            `null` if the step has not been reviewed yet.

                            '
                          example: '2021-01-01T00:00:00Z'
                        was_approved:
                          type:
                          - boolean
                          - 'null'
                          description: 'Whether this step of the approval process was approved.

                            `true` if approved, `false` if rejected or queried, `null` if not yet reviewed.

                            '
                          example: true
                        notes:
                          type:
                          - string
                          - 'null'
                          description: 'Notes about this step of the approval process.


                            Required when rejecting, querying, or adjusting the invoice. Optional when approving.

                            '
                          example: Looks good to me
                        invoice_status:
                          type: string
                          description: 'The status of the invoice at the time in which the state is created.

                            Only populated in some cases.

                            '
                          example: in_review
                  tracker_states:
                    type: array
                    description: 'The states that the invoice tracker can be in during the approval workflow.

                      '
                    items:
                      type: object
                      description: 'The invoice state as displayed in the invoice tracker in the Apperio platform.

                        '
                      properties:
                        short_name:
                          type: string
                          description: 'The short name of the invoice state.

                            '
                          example: GC
                        state:
                          type: string
                          description: "The state of this step in the invoice approval workflow.\nThis is one of:\n  * `approved` - The invoice is already past this step.\n  * `review` - The invoice is currently at this step.\n  * `pending` - The invoice is yet to reach this step.\n"
                          enum:
                          - approved
                          - review
                          - pending
                          example: approved
                        stage:
                          type: int
                          description: 'The stage of this step in the invoice approval workflow.

                            This is a number that represents the order of the steps in the workflow.

                            '
                          example: 3
                          deprecated: true
                  current_step:
                    type: int
                    description: 'The current step in the approval workflow.


                      References the `step` property in the `invoice_approval_states` array.

                      '
                    example: 3
                  permissions:
                    type: object
                    description: 'The permissions that the user has for the invoice.

                      '
                    properties:
                      can_approve:
                        type: boolean
                        description: 'Whether the user can approve, reject or query the invoice.

                          '
                        example: true
                  rejection_next_step:
                    type: int
                    description: "The next step in the approval workflow if the invoice is rejected.\n\nThis can be one of two values:\n  * 0 - the invoice will be moved back to the beginning of the approval workflow when rejected\n  * 1 - the invoice will be moved to the previous step in the approval workflow when rejected\n"
                    enum:
                    - 0
                    - 1
                    example: 0
                  invoice_total:
                    type: string
                    format: decimal
                    description: 'The total amount that is payable on the invoice.

                      '
                    example: '1320.00'
                  payable:
                    type: string
                    format: decimal
                    description: 'The total amount that is payable on the invoice.

                      '
                    example: '1320.00'
                  withheld_fees:
                    type: string
                    format: decimal
                    description: 'The total amount of fees that have been withheld from the invoice.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: '100.00'
                  withheld_user_id:
                    type: int
                    description: 'The user ID that entered the withheld fees.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: 12345
                  withheld_date:
                    type: string
                    format: date
                    description: 'The date the withheld fees were entered.


                      *NOTE: This field is specific to Qatar''s withholding tax laws.*

                      '
                    example: '2021-01-01'
        '401':
          description: 'Unauthenticated access - ensure to create a valid API token

