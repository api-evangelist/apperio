            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Apperio identifier for the attribute
                      example: 42
                    label:
                      type: string
                      maxLength: 50
                      description: Human-readable label displayed in forms and the UI
                      example: Cost Center
                    name:
                      type: string
                      maxLength: 50
                      description: 'Machine-readable field name used as the key in invoice attribute data and in

                        `attribute_{name}` filter parameters. Auto-generated from `label` (lowercased,

                        spaces replaced with underscores) if not provided on creation. Immutable after

                        creation. Must start with a lowercase letter and contain only lowercase letters,

                        numbers, and underscores.

                        '
                      example: cost_center
                    attr_type:
                      type: string
                      enum:
                      - text
                      - long_text
                      - email
                      - dropdown
                      description: 'The type of the attribute. Immutable after creation.

                        - `text`: short free-text value

                        - `long_text`: multi-line free-text value

                        - `email`: validated email address

                        - `dropdown`: value selected from a predefined list of options

                        '
                      example: text
                    default_value:
                      type: string
                      description: 'Default value for the attribute. For `dropdown` attributes this is the value

                        of the default option (see `options`). For `email` attributes the value is

                        validated as a valid email address.

                        '
                      example: CC-0000
                    placeholder:
                      type: string
                      maxLength: 30
                      description: Placeholder text shown in the input field
                      example: e.g. CC-1234
                    show_in_form:
                      type: boolean
                      description: Whether this attribute is shown in the invoice submission form
                      example: true
                    is_required:
                      type: boolean
                      description: 'Whether this attribute is required when submitting an invoice. An attribute

