  /api/v1/filter/matter-tag-sets/{matter-tag-set-id}/matter-tags/:
    post:
      summary: Create matter tags
      description: 'Capabilities: BUSINESS


        Create new matter tags that can be assigned to matters.

        '
      tags:
      - Filter
      parameters:
      - name: matter-tag-set-id
        in: path
        schema:
          type: int
          description: Matter tag ID
          example: 350
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              description: 'The Matter Tag Set that can be set against matters for group

                reporting and discovery purposes.

                '
              required:
              - name
              properties:
                id:
                  type: int
                  description: Apperio identifier for the matter tag set
                  example: 12345
                  readOnly: true
                name:
                  type: string
                  description: Name of the tag
                  example: Land Aquisition
                tag_set:
                  type: int
                  description: Parent tag set
                  example: 123
                  readOnly: true
      responses:
        '201':
          description: 'Matter Tag Created

            '
          content:
            application/json:
              schema: *id001
        '400':
          description: 'Invalid request. Ensure there isn''t already a tag with this name

            '
        '401':
          description: 'Unauthenticated access - ensure to create a valid API token

            '
        '403':
          description: 'Unauthorized access - Ensure your organisation own this tag set

            '
        '404':
          description: 'Tag Set the tag you''re adding to doesn''t exist

            '
