      responses:
        '200':
          description: 'Filtered data

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - is_redacted
                      properties:
                        engagement_id:
                          type: int
                          description: Apperio identifier for the matter
                        is_redacted:
                          type: boolean
                          description: Does the matter contain confidential redacted content
                          example: false
                        accessible:
                          type: boolean
                          description: (Law Firm Only) Is the matter shared with the business
                        billable:
                          type: number
                          example: 147214.29
                          description: Total billed and WIP for this matter over all time in the matter currency
                        billed:
                          type: number
                          example: 147214.29
                          description: Total billed for this matter over all time in the matter currency
                        budget_total:
                          type: number
                          example: 50000
                          description: The total budget for the matter in the matter currency
                        budget_total_disbursements:
                          type: number
                          example: 50000
                          description: The disbursement budget for the matter in the matter currency
                        budget_total_fees:
                          type: number
                          example: 50000
                          description: The fee budget for the matter in the matter currency
                        business_engagement_name:
                          type: string
                          example: Kilimanjaro
                          description: (Business Only) business matter name
                        business_matter_type_id:
                          type: int
                          nullable: true
                          description: (Business Only) Apperio identifer of the matter type
                        client_id:
                          type: string
                          description: (Law Firm Only) law firm client identifier
                        client_name:
                          type: string
                          description: (Law Firm Only) law firm client name
                          example: Acme International
                        confidential:
                          type: boolean
                          description: (Law Firm Only) Is this matter confidential
                          example: false
                        confidential_project:
                          type: boolean
                          description: (Business Only) Is this matter confidential
                          example: false
                        created_at:
                          type: datetime
                          description: Matter creation date
                        currency:
                          type: string
                          example: GBP
                          description: ISO 4217 Three letter currency code
                          minLength: 3
                          maxLength: 3
                        disbursements_billable:
                          type: number
                          example: 147214.29
                          description: Total disbursements billable for this matter over all time in the matter currency
                        disbursements_billed:
                          type: number
                          example: 147214.29
                          description: Total disbursements billed for this matter over all time in the matter currency
                        disbursements_wip:
                          type: number
                          example: 147214.29
                          description: Total disbursement wip for this matter in the matter currency
                        earliest_work_date:
                          type: date
                          description: First work date on this matter
                        fees_billable:
                          type: number
                          example: 147214.29
                          description: Total fees billable for this matter over all time in the matter currency
                        fees_billed:
                          type: number
                          example: 147214.29
                          description: Total fees billed for this matter over all time in the matter currency
                        fees_wip:
