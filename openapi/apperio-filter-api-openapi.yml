  /api/v1/filter/invoices/:
    get:
      summary: Discover invoice resources
      description: 'Capabilities: BUSINESS, LAW_FIRM, PAGINATION



        Invoice discovery endpoint. The returned projection can be controlled by setting the

        `fields` parameter to just return the fields you require. Results can be ordered and

        paginated.


        ## Filtering by attributes


        Invoices can be filtered by their custom attribute values using dynamic query parameters

        in the form `attribute_{name}`, where `{name}` is the attribute name as configured for

        the business. For example, to filter invoices where the `cost_center` attribute equals

        `CC-1234`, pass `attribute_cost_center=CC-1234`. Attribute filter values are matched

        as exact strings. Available attribute names depend on the business configuration.

        '
      tags:
      - Filter
      parameters:
      - name: fields
        in: query
        required: true
        schema:
          type: string
          example: invoice_id%2Cbilled%2Cbilling_entity_id
          description: 'The filter API is designed to provide broad information about resources for easy resource

            discovery. The client can choose which denormalised fields can appear in the projection clause.

            Only the selected fields will be included in the response. Fields are comma

            separated. The commas will need to be URL encoded (%2C)


            The full list of available fields depends on the type of the user''s organisation (business or firm).

            Most of the fields are available to all users, but some are restricted.


            | Field name | Description | Business | Firm |

            |------------|-------------|:--------:|:----:|

            | `invoice_id` | Apperio ID of an invoice | ✅ | ✅ |

            | `service_provider_type` | The type of firm (`legal` or `accountancy`).<br> Only available if the business is connected to firms of multiple types | ✅ | ❌ |

            | `number` | The invoice number | ✅ | ✅ |

            | `date` | The date the invoice was issued at | ✅ | ✅ |

            | `start_date` | The beginning of the invoice period | ✅ | ✅ |

            | `end_date` | The end of the invoice period | ✅ | ✅ |

            | `business_id` | Apperio ID of the "business" entity | ❌ | ✅ |

            | `billing_entity_id` | The ID of the billing entity | ✅ | ✅ |

            | `billing_entity` | The billing entity. An object with the following fields: `id`, `business_id`, `name` | ✅ | ✅ |

            | `law_firm` | The firm. An object with the following fields: `id`, `name` | ✅ | ❌ |

            | `law_firm_id` | Apperio ID of a firm | ✅ | ✅ |

            | `law_firm_reference` | The firm reference of the invoice (usually equal to the invoice number) | ✅ | ✅ |

            | `law_firm_name` | The name of the firm | ✅ | ❌ |

            | `engagements` | List of matter details for a given invoice. List of objects with the following fields: `engagement_id`, `number`, `currency`, `billed`, `fees_billed, `disbursements_billed`, `wip`, `fees_wip`, `disbursements_wip`, `flagged`, `fees_flagged`, `disbursements_flagged`, and either `business_engagement_name` and `project_id` or `law_firm_engagement_name`, depending on the type of the user | ✅ | ✅ |

            | `credits` | List of credit note details for a given invoice. List of objects with the following fields: `id`, `law_firm_id`, `law_firm_reference`, `invoice_id`, `is_cancelled`, `date`, `refunded_fee`, `refunded_disbursement`, `refunded_tax`, `has_been_ebilled`, `document'' | ✅ | ✅ |

            | `currency` | The invoice currency | ✅ | ✅ |

            | `billed` | The total amount billed on the invoice| ✅ | ✅ |

            | `total_amount` | The total amount on the invoice (regardless of its billed status) | ✅ | ✅ |

            | `total_amount_adjusted` | The total amount on the invoice (regardless of its billed status), adjusted to exclude the withheld fees | ✅ | ❌ |

            | `billed_business` | The total amount billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `billed_law_firm` | The total amount billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `fees_billed` | The amount of fees billed on the invoice | ✅ | ✅ |

            | `fees_billed_business` | The amount of fees billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `fees_billed_law_firm` | The amount of fees billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `disbursements_billed` | The amount of disbursements billed on the invoice | ✅ | ✅ |

            | `disbursements_billed_business` | The amount of disbursements billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `disbursements_billed_law_firm` | The amount of disbursements billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `wip` | The total amount expected to be billed on the invoice| ✅ | ✅ |

            | `wip_business` | The total amount expected to be billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `wip_law_firm` | The total amount expected to be billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `fees_wip` | The amount of fees expected to be billed on the invoice | ✅ | ✅ |

            | `fees_wip_business` | The amount of fees expected to be billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `fees_wip_law_firm` | The amount of fees expected to be billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `disbursements_wip` | The amount of disbursements expected to be billed on the invoice | ✅ | ✅ |

            | `disbursements_wip_business` | The amount of disbursements expected to be billed on the invoice, converted into the business default currency | ✅ | ❌ |

            | `disbursements_wip_law_firm` | The amount of disbursements expected to be billed on the invoice, converted into the firm default currency | ❌ | ✅ |

            | `has_flagged_items` | Are there any flagged line items on the invoice? | ✅ | ✅ |

            | `flagged` | The total amount flagged on the invoice| ✅ | ✅ |

            | `fees_flagged` | The amount of fees flagged on the invoice | ✅ | ✅ |

            | `disbursements_flagged` | The amount of disbursements flagged on the invoice | ✅ | ✅ |

            | `has_withholding_tax` | Is there withholding tax recorded for that invoice? | ✅ | ✅ |

            | `withheld_fees` | The amount of fees withheld on the invoice| ✅ | ❌ |

            | `withheld_user_id` | The amount of fees flagged on the invoice | ✅ | ❌ |

            | `is_manual` | Is this an invoice for a manually created matter? | ✅ | ✅ |

            | `permissions` | The current user''s permissions on the invoice. Object containing the following fields: `can_read_all_engagements`, `can_see_flagged` | ✅ | ✅ |

            | `has_pms_spend` | Is the underlying spend data coming from the PMS available in Apperio? | ✅ | ✅ |

            | `has_matching_pms_spend` | Does the underlying spend data match the values recorded on the invoice? | ✅ | ✅ |

            | `pms_currency` | The invoice currency as recorded in the PMS | ✅ | ✅ |

            | `client_id` | The Apperio ID of the client | ❌ | ✅ |

            | `client_name` | The name of the client | ✅ | ✅ |

            | `is_ebilled` | Has this invoice been submitted through the Apperio ebilling system? | ✅ | ✅ |

            | `ebilling_id` | The Apperio ID of the ebilling invoice | ✅ | ✅ |

            | `ebilling_source` | The source of the ebilling invoice. `pdf` or `ledes` | ✅ | ✅ |

            | `ebilling_date` | The date the invoice was issued, as entered in Apperio | ✅ | ✅ |

            | `ebilling_currency` | The invoice currency, as entered in Apperio| ✅ | ✅ |

            | `ebilling_fees_billed` | Fees billed on the invoice, as entered in Apperio| ✅ | ✅ |

            | `ebilling_disbursements_billed` | Disbursements billed on the invoice, as entered in Apperio | ✅ | ✅ |

            | `ebilling_billed` | Total amount billed on the invoice, as entered in Apperio | ✅ | ✅ |

            | `ebilling_status` | Invoice status. `pending`, `queried`, `ebilled`, `in_review`, `approved`, `paid`, `cancelled` | ✅ | ✅ |

            | `ebilling_status_display` | The human-readable invoice status. | ✅ | ✅ |

            | `ebilling_status_changed_at` | The date and time the status was last changed | ✅ | ✅ |

            | `ebilling_status_changed_automatically` | Was the status changed automatically? (auto-void, auto-approve) | ✅ | ✅ |

            | `ebilling_void_queried_at` | When is this invoice going to be automatically voided | ❌ | ✅ |

            | `ebilling_tax_type` | The tax type. `VAT`, `GST`, `OTHER` | ✅ | ✅ |

            | `ebilling_tax_total` | The amount of tax on the invoice, as entered in Apperio | ✅ | ✅ |

            | `custom_approval_state_id` | The ID of the custom approval state | ✅ | ❌ |

            | `custom_approval_state_created_at` | When did the invoice enter this custom approval state | ✅ | ❌ |

            | `custom_approval_state_changed_at` | When was the custom approval state last changed | ✅ | ❌ |

            | `custom_approval_state` | The current custom approval state. An object with the following fields: `name`, `short_name`, `assign_approver`. `null` if no custom approval state is set | ✅ | ❌ |

            | `custom_approval_reviewer_id` | The ID of the user who changed the custom approval state | ✅ | ❌ |

            | `invoice_approval_state_id` | The ID of the invoice approval state. `null` if no approval state is set | ✅ | ❌ |

            | `ebilling_matter_mismatch` | Deprecated. Is there a mismatch between the invoice and the underlying PMS data? | ✅ | ✅ |

            | `ebilling_original_invoice` | The Apperio ID of the original invoice if this is a replacement | ✅ | ❌ |

            | `ebilling_replaced_by` | The Apperio ID of the invoice replacing this one | ✅ | ❌ |

            | `attributes` | An object mapping invoice attribute names to their values. Attribute keys and values are strings. The available attributes depend on the business configuration — each business can define custom attributes for their invoices | ✅ | ✅ |

            '
      - name: page
        in: query
        schema:
          type: string
          example: dj0yJnA9MiZnPWJiNTdmMDg2NzI2YzQxYWRhZmI4NmZjMjRlODI5ZTIz
          description: 'Go to a specific page of content. This cursor is returned in the

