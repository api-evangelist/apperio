  /api/v1/filter/matter-tag-sets/:
    get:
      summary: List matter tag sets
      description: 'Capabilities: BUSINESS


        Tag sets allow matters to be grouped by their attributes. Examples of groupings could

        be projects, deals and teams managing the matter.

        '
      tags:
      - Filter
      parameters:
      - name: show_list_view
        in: query
        schema:
          type: boolean
          description: Filter based on whether it will be displayed in a dedicated list view
          example: true
      - name: page_template
        in: query
        schema:
          type: boolean
          description: Filter based on whether the individual tags have their own summary page
          example: true
      responses:
        '200':
          description: 'List matter tag sets

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: 'The Matter Tag Set is a grouping of tags that can be assigned to

                    matters. Contact Customer Succcess to set up groupings that fit

                    your business workflows.

                    '
                  required:
                  - id
                  - name
                  - number_of_tags
                  - organisation_id
                  - page_template
                  - selection_mode
                  - show_list_view
                  properties:
                    id:
                      type: int
                      description: Apperio identifier for the matter tag set
                      example: 123
                    name:
                      type: string
                      description: Name of the tag set
                      example: Projects
                    number_of_tags:
                      type: int
                      description: Number of tags in this tag set
                      example: 15
                    organisation_id:
                      type: int
                      description: Organisation owning the matter tag
                      example: 12345
                    page_template:
                      type: boolean
                      description: Should this tag set have a landing page in Apperio
                      example: true
                    selection_mode:
                      type: string
                      enum:
                      - dropdown
                      - text
                      example: dynamic
                      description: "Selection Mode: What's the best mechanism for selecting tags in the set.\n  * `dropdown` - Select tags in this set as a dropdown (recommended with low cardinality sets)\n  * `text` - Select tags in the set via a partial text match (recommended with high cardinality sets)\n"
                    show_list_view:
                      type: boolean,
                      description: Have a dedicated search screen for this tag set in Apperio
                      example: true
        '400':
          description: 'Invalid request

            '
        '401':
          description: 'Unauthenticated access - ensure to create a valid API token

            '
        '403':
          description: 'Unauthorized access


            This endpoint is currently only available to business users.

            If you are receiving this with a business token contact

            Apperio Customer Success about enabling this on your account.

            '
